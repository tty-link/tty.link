<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tty.link</title>
<meta name="description" content="We make fun things that make people happy.">
<meta name="theme-color" content="#ffd84a">
<meta name="color-scheme" content="light">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tty.link/">
<meta property="og:title" content="tty.link">
<meta property="og:description" content="We make fun things that make people happy :)">
<link rel="canonical" href="https://tty.link/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffd84a'/%3E%3Ctext x='32' y='44' font-family='ui-monospace,Menlo,monospace' font-size='34' font-weight='700' text-anchor='middle' fill='%231b2b7a'%3E:)%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&display=swap">
<script>document.documentElement.classList.add('js');</script>
<style>
  /* One sentence, typed like terminal output, that loosens up once it reaches the smile. */
  :root {
    --sun: #ffd84a;
    --ink: #1b2b7a;
    --pad: clamp(16px, 5vw, 72px);
    --mono: 'Recursive', ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr;
    padding: var(--pad);
    background: var(--sun);
    color: var(--ink);
    font-family: var(--mono);
    font-variation-settings: 'MONO' 1, 'CASL' 0;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--ink); color: var(--sun); }

  .mark { font-size: 15px; font-weight: 600; }

  .line {
    align-self: end;
    /* 18 monospace cells (0.6em each) fill the width between the gutters; em, not ch,
       because ch is measured before the MONO axis applies. */
    max-width: 10.85em;
    font-size: clamp(28px, calc((100vw - 2 * var(--pad)) / 10.9), 132px);
    font-weight: 750;
    line-height: 1.06;
    font-variation-settings: 'MONO' 1, 'CASL' 0;
    transition: font-variation-settings 1.1s cubic-bezier(.3, 1.4, .5, 1);
  }
  .line.happy { font-variation-settings: 'MONO' 1, 'CASL' 1; }
  html:not(.js) .line { font-variation-settings: 'MONO' 1, 'CASL' 1; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .js .type:not(.ready) { visibility: hidden; }
  .type .off { visibility: hidden; }
  /* The block is drawn to the letter height so it never touches the line above at this tight leading. */
  .type .cur { visibility: visible; color: transparent; background: linear-gradient(var(--ink), var(--ink)) 0 58% / 100% .92em no-repeat; }
  .type .cur.blink { animation: blink 1.06s steps(1) infinite; }
  @keyframes blink { 50% { background-size: 0 0; } }

  @media (max-width: 600px) {
    .line { max-width: 7.25em; font-size: calc((100vw - 2 * var(--pad)) / 7.3); }
  }
  @media (prefers-reduced-motion: reduce) {
    .line { transition: none; }
    .type .cur.blink { animation: none; }
  }
</style>
</head>
<body>
<p class="mark">tty.link</p>
<h1 class="line">
  <span class="sr">We make fun things that make people happy :)</span>
  <span class="type" aria-hidden="true">We make fun things that make people happy :)</span>
</h1>
<script>
(() => {
  const line = document.querySelector('.line');
  const type = line.querySelector('.type');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // One span per character plus a trailing cell for the cursor, so the layout never shifts while typing.
  const cells = [...type.textContent, ' '].map((ch) => {
    const cell = document.createElement('span');
    cell.textContent = ch;
    cell.className = 'off';
    return cell;
  });
  type.replaceChildren(...cells);
  const last = cells.length - 1;

  const finish = () => {
    cells.forEach((cell) => cell.classList.remove('off', 'cur'));
    cells[last].className = 'cur blink';
    type.classList.add('ready');
    line.classList.add('happy');
  };
  if (reduce) return finish();

  type.classList.add('ready');
  cells[0].className = 'cur blink';

  const delay = (ch) => (ch === ' ' ? 110 : 45) + Math.random() * 70;
  const step = (i) => {
    cells[i].className = '';
    cells[i + 1].className = 'cur';
    if (i + 1 === last) {
      cells[last].classList.add('blink');
      setTimeout(() => line.classList.add('happy'), 260);
      return;
    }
    setTimeout(() => step(i + 1), delay(cells[i + 1].textContent));
  };

  const start = () => setTimeout(() => step(0), 700);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(start, start);
})();
</script>
</body>
</html>
