<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tty.link</title>
<meta name="description" content="We make fun things that make people happy. 사람을 행복하게 하는 재미있는 것을 만듭니다.">
<meta name="theme-color" content="#ffd84a">
<meta name="color-scheme" content="light">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tty.link/">
<meta property="og:title" content="tty.link">
<meta property="og:description" content="We make fun things that make people happy. 사람을 행복하게 하는 재미있는 것을 만듭니다.">
<link rel="canonical" href="https://tty.link/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffd84a'/%3E%3Ctext x='32' y='44' font-family='ui-monospace,Menlo,monospace' font-size='34' font-weight='700' text-anchor='middle' fill='%231b2b7a'%3E:)%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&display=swap">
<script>document.documentElement.classList.add('js');</script>
<style>
  /* A sheet of wongoji (Korean manuscript paper). Hangul takes a whole square, Latin letters
     go two to a square, the way a terminal gives Hangul two columns and ASCII one.
     The rows are as many as the window holds; the empty ones are the part not written yet. */
  :root {
    --sun: #ffd84a;
    --ink: #1b2b7a;
    --rule: #e3ae1e;
    --pad: clamp(16px, 4vw, 56px);
    --latin: 'Recursive', ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    padding: var(--pad);
    background: var(--sun);
    color: var(--ink);
    font-family: var(--latin);
    font-variation-settings: 'MONO' 1, 'CASL' 0;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--ink); color: var(--sun); }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .sheet { --cols: 20; container-type: inline-size; max-width: 1400px; margin: 0 auto; }
  .row {
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    gap: 1px;
    border: 1px solid var(--rule);
    background: var(--rule);
  }
  /* The narrow band between rows is what makes it manuscript paper rather than graph paper. */
  .row + .row { margin-top: calc(100cqi / var(--cols) * .22); }
  .cell {
    display: grid;
    place-items: center;
    aspect-ratio: 1;
    overflow: hidden;
    background: var(--sun);
    font-size: calc(100cqi / var(--cols));
    line-height: 1;
  }
  .pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    place-items: center;
    width: 100%;
    height: 100%;
    padding: 0 .07em;
    font-size: .58em;
    font-weight: 560;
  }
  /* Sebul is a non-square (talnemo) face: syllables share a top line and end at different
     depths. So each one hangs from the same height in its square instead of being centred. */
  .cell font-kku { align-self: start; margin-top: .2em; font-size: .66em; }
  /* A lone jamo (mid-typing, and the closing ㅎㅎ) comes from the device font at its small
     compatibility size; bring it up to the size it takes inside a syllable. */
  /* Pointing at a written square pulls its jamo apart; they may leave the square for a moment. */
  .cell:has(.kku-fx-open) { z-index: 1; overflow: visible; }
  .cell font-kku [data-glyph-kind="symbol"] { display: inline-block; font-size: 1.3em; transform: translateY(-.24em); }

  /* Without the script the sheet cannot be written; the sentences are shown plainly instead. */
  html:not(.js) .sheet { display: none; }
  html:not(.js) .sr { position: static; width: auto; height: auto; clip-path: none; white-space: normal; font-size: clamp(24px, 4vw, 44px); line-height: 1.4; }
  html:not(.js) .sr span { display: block; }
</style>
</head>
<body>
<h1 class="sr">
  <span lang="en">We make fun things that make people happy.</span>
  <span lang="ko">사람을 행복하게 하는 재미있는 것을 만듭니다.</span>
</h1>
<div class="sheet" aria-hidden="true"></div>

<script src="/vendor/font-kku/font-kku.js" data-fonts="sebul"></script>
<script src="/vendor/font-kku/font-kku-fx.js"></script>
<script>
(() => {
  const NAME = 'tty.link';
  const EN = 'we make fun things that make people happy :)';
  const KO = '사람을 행복하게 하는 재미있는 것을 만듭니다 ㅎㅎ';

  const sheet = document.querySelector('.sheet');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- Hangul: add the dokkaebibul a real dubeolsik IME shows ----
     typingFrames() puts a consonant typed after an open syllable in the next square ("사ㄹ").
     An IME first hangs it under the syllable as a final ("살"), then hands it to the next
     square once a vowel follows ("사라"). That hop between squares is kept here. */
  const JONG = ' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
  const PAIRS = { ㄱㅅ: 'ㄳ', ㄴㅈ: 'ㄵ', ㄴㅎ: 'ㄶ', ㄹㄱ: 'ㄺ', ㄹㅁ: 'ㄻ', ㄹㅂ: 'ㄼ', ㄹㅅ: 'ㄽ', ㄹㅌ: 'ㄾ', ㄹㅍ: 'ㄿ', ㄹㅎ: 'ㅀ', ㅂㅅ: 'ㅄ' };
  const hangeul = (ch) => ch >= '가' && ch <= '힣';
  const withFinal = (syl, jamo) => {
    const code = syl.charCodeAt(0) - 0xac00;
    const jong = code % 28;
    const next = jong === 0 ? jamo : PAIRS[JONG[jong] + jamo];
    const idx = next ? JONG.indexOf(next) : -1;
    return idx > 0 ? String.fromCharCode(0xac00 + code - jong + idx) : null;
  };
  const dokkaebibul = (frame) => {
    const prev = frame[frame.length - 2], last = frame[frame.length - 1];
    if (!prev || !hangeul(prev) || JONG.indexOf(last) < 1) return frame;
    const merged = withFinal(prev, last);
    return merged ? frame.slice(0, -2) + merged : frame;
  };
  const koFrames = FontKkuFx.typingFrames(KO).map(dokkaebibul);

  /* ---- Layout on the squares ---- */
  // Latin text flows in half squares (two characters a square), whole words to a row.
  function flowLatin(text, cols, row) {
    const width = cols * 2, at = [];
    let col = 2, fresh = true; // a paragraph opens with one empty square
    for (const m of text.matchAll(/\S+/g)) {
      if (!fresh) col += 1;
      if (col + m[0].length > width) { row += 1; col = 0; }
      for (let i = 0; i < m[0].length; i++, col++) at[m.index + i] = [row, col >> 1, col & 1];
      fresh = false;
    }
    return { at, last: row };
  }
  // Hangul takes one square a syllable, a space takes one square, never at the start of a row.
  function flowHangul(text, cols, row) {
    const at = [];
    let col = 1, fresh = true;
    for (const m of text.matchAll(/\S+/g)) {
      if (!fresh) col += 1;
      if (col + m[0].length > cols) { row += 1; col = 0; }
      for (let i = 0; i < m[0].length; i++, col++) at[m.index + i] = [row, col];
      fresh = false;
    }
    return { at, last: row };
  }

  let view = null;
  let scatters = [];
  function bindScatter() {
    scatters.forEach((fx) => fx.stop());
    scatters = view.ko.filter(Boolean).map((host) => FontKkuFx.scatter(host, { distance: .8 }));
  }
  const state = { en: reduce ? EN.length : 0, ko: reduce ? koFrames.length - 1 : -1 };

  function build() {
    const cols = innerWidth < 720 ? 10 : 20;
    sheet.style.setProperty('--cols', cols);

    // Row 0 carries the name, right-aligned with one square left after it, as on a manuscript.
    const nameStart = cols - 1 - Math.ceil(NAME.length / 2);
    const name = [...NAME].map((_, i) => [0, nameStart + (i >> 1), i & 1]);
    const en = flowLatin(EN, cols, 2);
    const ko = flowHangul(KO, cols, en.last + 2);

    const cell = Math.min(sheet.clientWidth, 1400) / cols;
    const fits = Math.floor((innerHeight - 2 * parseFloat(getComputedStyle(document.body).paddingTop) + cell * .22) / (cell * 1.22));
    const rows = Math.max(ko.last + 1, fits);
    if (view && view.cols === cols && view.rows === rows) return;

    const grid = [];
    const frag = document.createDocumentFragment();
    for (let r = 0; r < rows; r++) {
      const rowEl = document.createElement('div');
      rowEl.className = 'row';
      grid.push([...Array(cols)].map(() => rowEl.appendChild(Object.assign(document.createElement('div'), { className: 'cell' }))));
      frag.append(rowEl);
    }
    const slot = ([r, c, s]) => {
      const box = grid[r][c];
      if (!box.firstChild) box.innerHTML = '<span class="pair"><span></span><span></span></span>';
      return box.firstChild.children[s];
    };
    const host = ([r, c]) => {
      const box = grid[r][c];
      if (!box.firstChild) {
        const el = document.createElement('font-kku');
        el.setAttribute('font', 'sebul');
        el.setAttribute('size', '1em');
        box.append(el);
      }
      return box.firstChild;
    };
    name.forEach((p, i) => { slot(p).textContent = NAME[i]; });
    view = {
      cols, rows,
      en: en.at.map((p) => p && slot(p)),
      ko: ko.at.map((p) => p && host(p)),
    };
    sheet.replaceChildren(frag);
    paint();
    if (state.ko >= koFrames.length - 1) bindScatter();
  }

  // A drawn <font-kku> holds its jamo nodes, so its textContent is not the source text;
  // remember what each square shows and write only when that changes (font-kku redraws on write).
  const shown = new WeakMap();
  function paint() {
    view.en.forEach((el, i) => { if (el) el.textContent = i < state.en ? EN[i] : ''; });
    const frame = koFrames[state.ko] || '';
    view.ko.forEach((el, i) => {
      if (!el) return;
      const ch = frame[i] && frame[i] !== ' ' ? frame[i] : '';
      if ((shown.get(el) ?? '') !== ch) { shown.set(el, ch); el.textContent = ch; }
    });
  }

  // A hand's rhythm: quick inside a word, a breath at each space.
  const beat = (base, ch) => (ch === ' ' ? base * 2.6 : base) + Math.random() * base;
  function typeEnglish() {
    if (state.en >= EN.length) return;
    state.en += 1;
    paint();
    setTimeout(typeEnglish, beat(48, EN[state.en]));
  }
  function typeKorean() {
    if (state.ko >= koFrames.length - 1) return bindScatter();
    state.ko += 1;
    paint();
    const next = koFrames[state.ko + 1] || '';
    setTimeout(typeKorean, beat(62, next[next.length - 1]));
  }

  build();
  let resizing;
  addEventListener('resize', () => { clearTimeout(resizing); resizing = setTimeout(build, 120); });

  if (!reduce) {
    // Wait for the fonts so the first letters are not set twice, but never longer than 2.5s.
    let started = false;
    const start = () => {
      if (started) return;
      started = true;
      setTimeout(typeEnglish, 500);
      setTimeout(typeKorean, 1400);
    };
    const loaded = new Promise((go) => (document.readyState === 'complete' ? go() : addEventListener('load', go, { once: true })));
    Promise.all([document.fonts ? document.fonts.ready : null, loaded]).then(start, start);
    setTimeout(start, 2500);
  }
})();
</script>
</body>
</html>
