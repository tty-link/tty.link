<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | tty.link</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffd84a">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffd84a'/%3E%3Ctext x='32' y='44' font-family='ui-monospace,Menlo,monospace' font-size='34' font-weight='700' text-anchor='middle' fill='%231b2b7a'%3E:)%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&display=swap">
<style>
  /* The home page's sentence, turned the other way. */
  :root {
    --sun: #ffd84a;
    --ink: #1b2b7a;
    --pad: clamp(16px, 5vw, 72px);
    --mono: 'Recursive', ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr;
    padding: var(--pad);
    background: var(--sun);
    color: var(--ink);
    font-family: var(--mono);
    font-variation-settings: 'MONO' 1, 'CASL' 1;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--ink); color: var(--sun); }
  a { color: inherit; text-underline-offset: .2em; text-decoration-thickness: 2px; }
  a:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; border-radius: 2px; }
  .mark { font-size: 15px; text-decoration: none; justify-self: start; }
  main { align-self: end; }
  /* The headline uses the stroke letters of the home page (font-size is the x-height). */
  h1 { font-size: clamp(20px, 5.4vw, 72px); font-weight: 400; line-height: 2.12; white-space: nowrap; }
  p { margin-top: .9em; font-size: clamp(16px, 2vw, 20px); font-weight: 500; }
</style>
<script src="/assets/tty-glyphs.js"></script>
</head>
<body>
<a class="mark" href="/" aria-label="tty.link">tty.link :)</a>
<main>
  <h1 aria-label="No page here :(">No page here :(</h1>
  <p>This address doesn't exist. <a href="/">Go to the tty.link home page</a></p>
</main>
<script>
  TTYGlyphs.wordmark(document.querySelector('.mark'));
  TTYGlyphs.setWords(document.querySelector('h1'), ['No', 'page', 'here', ':(']);
</script>
</body>
</html>
