<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank-You, Traced | tty.link</title>
<script src="/pages/_kit.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&family=Spline+Sans+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<script src="https://font.tty.link/lib/font-kku.js" data-fonts="sebul dunggeun"></script>
<style>
  /* One "thank you", traced hop by hop across a city at dusk, laid out like traceroute output
     (to 127.0.0.1, which takes six hops here). Each hop passes it on to the next person; unlike
     a real packet the TTL goes up at every hop, and it multiplies instead of getting lost. */
  :root {
    --night: #1b2140;
    --block: #262e58;
    --block-edge: #313b6e;
    --road: #2d3564;
    --park: #24584b;
    --window: #ffd27a;
    --arc: #ff8fa3;
    --heart: #ff5c8a;
    --mint: #7ef0c8;
    --text: #f4f1ff;
    --dim: #aeb3d9;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    container-type: size;
    overflow: hidden;
    color: var(--text);
    background: radial-gradient(90% 70% at 30% 0%, #2c2f63 0%, var(--night) 60%);
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
  }
  .lang-ko body { font-family: 'IBM Plex Sans KR', 'Hanken Grotesk', sans-serif; }
  .mono { font-family: 'Spline Sans Mono', ui-monospace, monospace; }

  .wrap {
    display: grid;
    height: 100%;
    padding: 4.4cqmin 5cqmin;
    gap: 2.4cqmin 4cqmin;
    grid-template-columns: 1.25fr 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "head head" "map hops" "sum sum";
  }
  @container (orientation: portrait) {
    .wrap {
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      grid-template-areas: "head" "map" "hops" "sum";
      gap: 1.8cqmin;
    }
  }

  .head { grid-area: head; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 1cqmin 3cqmin; }
  .head h1 { font-size: max(24px, 5.4cqmin); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
  .head h1 > font-kku { color: var(--text); }
  .head .sub { margin-top: .8cqmin; font-size: max(13px, 2.1cqmin); color: var(--dim); }
  .lang-ko .head .sub { word-break: keep-all; }
  .stats { display: flex; gap: 2.4cqmin; font-size: max(12px, 1.9cqmin); color: var(--dim); }
  .stats b { display: block; font-size: max(20px, 3.6cqmin); font-weight: 600; color: var(--text); line-height: 1.1; }
  .stats .ttl b { color: var(--mint); }

  .map { grid-area: map; min-height: 0; display: grid; }
  .map svg { width: 100%; height: 100%; display: block; cursor: pointer; }
  .pin-face { transition: transform .3s; transform-box: fill-box; transform-origin: center; }

  .trace { grid-area: hops; align-self: center; min-width: 0; font-size: max(12px, 1.9cqmin); }
  /* The line traceroute prints first. */
  .cmd { margin-bottom: .7em; color: var(--dim); font-size: .86em; line-height: 1.35; }
  .hops { list-style: none; padding: 0; }
  .hop {
    display: grid;
    grid-template-columns: 2.2em 1fr auto;
    gap: .2em .8em;
    padding: .7em 0;
    border-top: 1px solid rgba(174, 179, 217, .18);
    visibility: hidden;
  }
  .hop.on { visibility: visible; }
  .hop:last-child { border-bottom: 1px solid rgba(174, 179, 217, .18); }
  .hop .n { color: var(--dim); }
  .hop .who { font-weight: 600; font-size: 1.08em; }
  .hop .ttl { color: var(--mint); text-align: right; }
  .hop .what { grid-column: 2; color: var(--dim); }
  .hop .lat { grid-column: 3; text-align: right; color: var(--arc); white-space: nowrap; }
  .lang-ko .hop .what { word-break: keep-all; }
  @container (orientation: portrait) {
    .trace { font-size: 12px; }
    .cmd { margin-bottom: .3em; }
    .cmd .more { display: none; }
    .hop { padding: .38em 0; grid-template-columns: 1.8em 1fr auto 4.6em; }
    /* One line per hop on phones; the newest hop also gets its story underneath. */
    .hop:not(.cur) .what { display: none; }
    .hop.cur .what { grid-area: 2 / 2 / 3 / 5; font-size: .95em; }
    .hop .n { grid-area: 1 / 1; }
    .hop .who { grid-area: 1 / 2; }
    .hop .lat { grid-area: 1 / 3; }
    .hop .ttl { grid-area: 1 / 4; }
  }

  .sum { grid-area: sum; min-height: 2.6em; font-size: max(14px, 2.4cqmin); }
  .sum .line { visibility: hidden; }
  .sum .line.on { visibility: visible; }
  .sum .big > font-kku { color: var(--text); }
  .sum .note { margin-top: .5cqmin; font-size: .82em; color: var(--dim); }
  .lang-ko .sum .note { word-break: keep-all; }
  /* Opened on its own on a phone, _kit.js puts a small ":)" button bottom-right; keep clear of it. */
  @media (max-width: 600px) { html:not(.embedded) .sum { padding-right: 44px; } }
</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <div>
      <h1 data-lang="en">Thank-you, traced</h1>
      <h1 data-lang="ko"><font-kku font="sebul" size="1em">고마움 경로 추적</font-kku></h1>
      <p class="sub" data-lang="en">We followed one “thank you” to see how far it goes.</p>
      <p class="sub" data-lang="ko">“고마워요” 한 마디가 어디까지 가는지 따라가 봤어요.</p>
    </div>
    <div class="stats mono" aria-live="polite">
      <p class="ttl"><b class="ttl-n">64</b><span>TTL</span></p>
      <p><b class="pk-n">1</b><span data-lang="en">packets</span><span data-lang="ko">패킷</span></p>
      <p><b>0</b><span data-lang="en">lost</span><span data-lang="ko">손실</span></p>
    </div>
  </header>

  <div class="map">
    <svg viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet" role="img">
      <title data-lang="en">A city at dusk with six people passing a thank-you along</title>
      <title data-lang="ko">고마움을 차례로 전하는 여섯 사람이 있는 저녁 도시</title>
      <g class="city"></g>
      <g class="web"></g>
      <g class="route"></g>
      <g class="pins"></g>
      <g class="fly"></g>
    </svg>
  </div>

  <div class="trace">
    <p class="cmd mono" data-lang="en">traceroute to you (127.0.0.1)<span class="more">, 64 hops max, 9 byte packets</span></p>
    <p class="cmd mono" data-lang="ko">traceroute to 나 (127.0.0.1)<span class="more">, 64 hops max, 12 byte packets</span></p>
    <ol class="hops"></ol>
  </div>

  <div class="sum">
    <p class="line big"></p>
    <p class="line note"></p>
  </div>
</main>

<script>
(() => {
  const SVG = 'http://www.w3.org/2000/svg';
  const $ = (s) => document.querySelector(s);
  const svg = $('.map svg');
  const city = $('.city'), web = $('.web'), route = $('.route'), pinsG = $('.pins'), fly = $('.fly');
  const hopsEl = $('.hops');
  const ttlN = $('.ttl-n'), pkN = $('.pk-n');
  const sumBig = $('.sum .big'), sumNote = $('.sum .note');
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(SVG, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.append(n);
    return n;
  };

  /* ---- The people, in hop order; the last hop comes home ---- */
  const PLACES = [
    { x: 92, y: 300, icon: 'desk' },
    { x: 214, y: 168, icon: 'store' },
    { x: 330, y: 268, icon: 'taxi' },
    { x: 452, y: 132, icon: 'guard' },
    { x: 520, y: 300, icon: 'play' },
  ];
  // Each hop passes it on to the next one; the last hop is where it started.
  const HOPS = TTY.t({
    en: [
      { who: 'You, leaving work', what: 'thanked the night-shift clerk by name', lat: '1 smile' },
      { who: 'Convenience store clerk', what: 'gave a cab driver the free coffee from a 2-for-1', lat: '2 smiles' },
      { who: 'Taxi driver', what: 'turned in a wallet left in the back seat', lat: 'a wave' },
      { who: 'Building security guard', what: 'pumped up the flat tire on a kid’s bike', lat: '* * a nod' },
      { who: 'Kid at the playground', what: 'ran after you with the glove you dropped', lat: 'a high-five' },
      { who: 'Back to you', what: 'said “thank you” again. See hop 1.', lat: '1 glove' },
    ],
    ko: [
      { who: '나, 퇴근길', what: '편의점 알바생 이름을 불러 고맙다고 했다', lat: '미소 1번' },
      { who: '편의점 알바생', what: '1+1 캔커피 하나를 택시 기사님께 드렸다', lat: '미소 2번' },
      { who: '택시 기사님', what: '뒷자리에 떨어진 지갑을 경비실에 맡겼다', lat: '손 인사' },
      { who: '경비 아저씨', what: '놀이터 아이 자전거에 바람을 넣어 줬다', lat: '* * 끄덕' },
      { who: '놀이터 아이', what: '내가 떨어뜨린 장갑을 들고 뛰어왔다', lat: '하이파이브' },
      { who: '다시 나', what: '또 “고맙습니다”. 1홉부터 다시.', lat: '장갑 한 짝' },
    ],
  });
  // 1 sent, n received: the count is whatever the city has reached by the end (taps add more).
  const SUMMARY = TTY.t({
    en: [(n) => `1 sent. ${n} received. 0% loss.`, 'Routers take one off the TTL at every hop. Here, everyone added one.'],
    ko: [(n) => `1개 보냄, ${n}개 받음, 손실 0%.`, '라우터는 홉마다 TTL을 하나씩 깎는데, 여기선 다들 하나씩 보태 줬어요.'],
  });
  const PACKETS = [1, 2, 4, 7, 12, 19];

  /* ---- A city at dusk, the same every time ---- */
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  el('rect', { x: 0, y: 0, width: 600, height: 400, rx: 18, fill: '#20274b' }, city);
  [[0, 214, 600, 18], [282, 0, 18, 400], [120, 0, 14, 214], [430, 214, 14, 186]].forEach(([x, y, w, h]) => el('rect', { x, y, width: w, height: h, fill: 'var(--road)' }, city));
  el('ellipse', { cx: 520, cy: 318, rx: 66, ry: 48, fill: 'var(--park)' }, city);
  [[480, 290], [556, 296], [548, 344], [492, 346]].forEach(([x, y]) => el('circle', { cx: x, cy: y, r: 9, fill: '#2f7a62' }, city));
  const blocks = [[20, 20, 90, 180], [146, 20, 124, 120], [312, 22, 98, 176], [430, 22, 150, 86], [20, 246, 120, 136], [160, 246, 110, 70], [312, 246, 104, 134], [158, 330, 112, 54]];
  blocks.forEach(([x, y, w, h]) => {
    el('rect', { x, y, width: w, height: h, rx: 6, fill: 'var(--block)', stroke: 'var(--block-edge)', 'stroke-width': 2 }, city);
    for (let wy = y + 12; wy < y + h - 12; wy += 16) {
      for (let wx = x + 10; wx < x + w - 12; wx += 15) {
        if (rnd() < .38) el('rect', { class: 'win', x: wx, y: wy, width: 7, height: 8, rx: 1.5, fill: 'var(--window)', opacity: (.45 + rnd() * .5).toFixed(2) }, city);
      }
    }
  });
  const windows = [...city.querySelectorAll('.win')].map((w) => ({ x: +w.getAttribute('x') + 3.5, y: +w.getAttribute('y') + 4 }));

  /* ---- Pins: a small sign for each place ---- */
  const ICONS = {
    desk: 'M-9 4 h18 M-6 4 v-9 h12 v9',
    store: 'M-10 -2 h20 l-2 -6 h-16 z M-8 -2 v9 h16 v-9 M-2 7 v-5 h4 v5',
    taxi: 'M-11 4 v-5 l3 -5 h16 l3 5 v5 z M-4 -10 h8 v3 h-8 z M-7 6 a2 2 0 1 0 0.1 0 M7 6 a2 2 0 1 0 0.1 0',
    guard: 'M-9 8 v-12 l9 -6 l9 6 v12 z M-3 8 v-7 h6 v7',
    play: 'M-10 8 l14 -14 h4 M4 -6 v14 M-10 8 h20',
  };
  const pins = PLACES.map((p, i) => {
    const g = el('g', { class: 'pin', transform: `translate(${p.x} ${p.y})` }, pinsG);
    el('circle', { r: 26, fill: 'var(--heart)', opacity: 0, class: 'halo' }, g);
    const face = el('g', { class: 'pin-face' }, g);
    el('circle', { r: 18, fill: '#fff4f6', stroke: 'var(--arc)', 'stroke-width': 3 }, face);
    el('path', { d: ICONS[p.icon], fill: 'none', stroke: '#3b3f72', 'stroke-width': 2.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, face);
    const tag = el('text', { x: 0, y: 34, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--dim)', class: 'mono' }, g);
    tag.textContent = String(i + 1);
    return g;
  });

  /* ---- Hop rows ---- */
  const rows = HOPS.map((h, i) => {
    const li = document.createElement('li');
    li.className = 'hop';
    li.innerHTML = `<span class="n mono">${i + 1}</span><span class="who"></span><span class="ttl mono">TTL ${64 + i}</span><span class="what"></span><span class="lat mono"></span>`;
    li.querySelector('.who').textContent = h.who;
    li.querySelector('.what').textContent = h.what;
    li.querySelector('.lat').textContent = h.lat;
    hopsEl.append(li);
    return li;
  });

  /* ---- Moving a heart along an arc ---- */
  const arcPath = (a, b, lift) => {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 - lift;
    return `M${a.x} ${a.y} Q${mx} ${my} ${b.x} ${b.y}`;
  };
  const heartD = 'M0 4 C -7 -1, -6 -8, 0 -4 C 6 -8, 7 -1, 0 4 Z';
  function send(a, b, { layer = route, lift = 80, width = 3, ms = 900, size = 1.6, faint = false } = {}) {
    return new Promise((done) => {
      const path = el('path', { d: arcPath(a, b, lift), fill: 'none', stroke: 'var(--arc)', 'stroke-width': width, 'stroke-linecap': 'round', opacity: faint ? .32 : .9 }, layer);
      const len = path.getTotalLength();
      if (TTY.reduce) { done(); return; }
      path.style.strokeDasharray = `${len}`;
      path.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: ms, easing: 'cubic-bezier(.5, 0, .3, 1)', fill: 'backwards' });
      const heart = el('path', { d: heartD, fill: 'var(--heart)' }, fly);
      const t0 = performance.now();
      const step = (now) => {
        const t = Math.min(1, (now - t0) / ms);
        const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        const p = path.getPointAtLength(len * e);
        heart.setAttribute('transform', `translate(${p.x} ${p.y}) scale(${size})`);
        if (t < 1) requestAnimationFrame(step);
        else { heart.remove(); done(); }
      };
      requestAnimationFrame(step);
    });
  }
  function pulse(i) {
    if (TTY.reduce) return;
    const halo = pins[i].querySelector('.halo');
    halo.animate([{ opacity: .5, transform: 'scale(.6)' }, { opacity: 0, transform: 'scale(1.5)' }], { duration: 700, easing: 'ease-out' });
    pins[i].querySelector('.pin-face').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.18)' }, { transform: 'scale(1)' }], { duration: 420, easing: 'cubic-bezier(.3, 1.6, .5, 1)' });
  }
  // Each kindness passed on also reaches a few bystanders: the packet multiplies.
  function spread(from, n) {
    const near = windows.slice().sort((p, q) => Math.hypot(p.x - from.x, p.y - from.y) - Math.hypot(q.x - from.x, q.y - from.y));
    for (let k = 0; k < n; k++) {
      const to = near[3 + Math.floor(Math.random() * Math.min(26, near.length - 3))];
      send(from, to, { layer: web, lift: 30 + Math.random() * 40, width: 1.6, ms: 700 + Math.random() * 500, size: .9, faint: true });
    }
  }
  function flip(node, value) {
    node.textContent = value;
    if (!TTY.reduce) node.animate([{ transform: 'translateY(-40%)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 260, easing: 'ease-out' });
  }
  function writeSummary() {
    const line = SUMMARY[0](pkN.textContent);
    if (TTY.lang === 'ko') {
      const kku = document.createElement('font-kku');
      kku.setAttribute('font', 'dunggeun');
      kku.setAttribute('size', '1.15em');
      kku.setAttribute('wrap-unit', 'word');
      kku.textContent = line;
      sumBig.replaceChildren(kku);
    } else {
      sumBig.textContent = line;
    }
  }
  function setSummary(on) {
    sumBig.classList.toggle('on', on);
    sumNote.classList.toggle('on', on);
  }

  /* ---- The trace ---- */
  const wait = (ms) => new Promise((r) => setTimeout(r, TTY.reduce ? 0 : ms));
  let run = 0;
  async function trace() {
    const mine = ++run;
    web.replaceChildren(); route.replaceChildren();
    rows.forEach((r) => r.classList.remove('on', 'cur'));
    setSummary(false);
    ttlN.textContent = '64'; pkN.textContent = '1';
    for (let i = 0; i < HOPS.length; i++) {
      if (mine !== run) return;
      const at = i % PLACES.length;
      if (i > 0) {
        const lift = i === HOPS.length - 1 ? 150 : 80;
        await send(PLACES[i - 1], PLACES[at], { lift });
        if (mine !== run) return;
      }
      pulse(at);
      rows.forEach((r) => r.classList.remove('cur'));
      rows[i].classList.add('on', 'cur');
      if (!TTY.reduce) rows[i].animate([{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], { duration: 380, easing: 'cubic-bezier(.4, 0, .2, 1)' });
      flip(ttlN, String(64 + i));
      flip(pkN, String(PACKETS[i]));
      if (i >= 1) spread(PLACES[at], PACKETS[i] - PACKETS[i - 1]);
      await wait(i === 0 ? 500 : 420);
    }
    if (mine !== run) return;
    writeSummary();
    sumNote.textContent = SUMMARY[1];
    setSummary(true);
    if (!TTY.reduce) sumBig.animate([{ transform: 'scale(.96)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, easing: 'cubic-bezier(.2, .9, .3, 1.2)' });
    if (!TTY.reduce) setTimeout(() => { if (mine === run) trace(); }, 9000);
  }

  // Tap the city to pass one more on from the nearest person.
  svg.addEventListener('click', (event) => {
    if (TTY.reduce) return;
    const pt = svg.createSVGPoint();
    pt.x = event.clientX; pt.y = event.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const from = PLACES.reduce((best, q) => (Math.hypot(q.x - p.x, q.y - p.y) < Math.hypot(best.x - p.x, best.y - p.y) ? q : best));
    const to = PLACES.filter((q) => q !== from)[Math.floor(Math.random() * (PLACES.length - 1))];
    pulse(PLACES.indexOf(from));
    send(from, to, { lift: 60 }).then(() => pulse(PLACES.indexOf(to)));
    spread(from, 3);
    flip(pkN, String(Number(pkN.textContent) + 4));
    flip(ttlN, String(Number(ttlN.textContent) + 1));
    if (sumBig.classList.contains('on')) writeSummary();
  });

  TTY.onShow(() => setTimeout(trace, TTY.reduce ? 0 : 500));
  const loaded = new Promise((r) => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
  Promise.all([loaded, document.fonts.ready]).then(TTY.ready);
})();
</script>
</body>
</html>
