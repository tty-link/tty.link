<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Password Meter With Feelings | tty.link</title>
<script src="/pages/_kit.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;600;800&family=Sniglet:wght@400;800&family=DM+Mono:wght@500&family=Gowun+Dodum&display=swap">
<script src="https://font.tty.link/lib/font-kku.js" data-fonts="sticker dunggeun"></script>
<style>
  /* A sign-up form whose strength meter is not a judge but a friend with opinions.
     The meter's face rides the end of the bar; its words come out in a bubble. */
  :root {
    --bg-1: #e4e2ff;
    --bg-2: #ffe1ec;
    --card: #ffffff;
    --ink: #24213f;
    --soft: #6c6890;
    --line: #dcd9f2;
    --weak: #ff5a5f;
    --meh: #ff9f1c;
    --smirk: #f5c518;
    --strong: #22b8a6;
    --love: #ff6fae;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    container-type: size;
    display: grid;
    place-items: center;
    overflow: hidden;
    background:
      radial-gradient(60cqmax 60cqmax at 12% 18%, rgba(255,255,255,.55), transparent 60%),
      linear-gradient(140deg, var(--bg-1), var(--bg-2));
    color: var(--ink);
    font-family: 'Rethink Sans', 'Gowun Dodum', system-ui, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 10px; }
  .lang-ko body { font-family: 'Gowun Dodum', 'Rethink Sans', sans-serif; word-break: keep-all; }
  .lang-ko .title { margin-top: 4.6cqi; }

  /* Floating shapes behind the card: keys and padlocks, quietly drifting. */
  .deco { position: absolute; inset: 0; pointer-events: none; }
  .deco i {
    position: absolute;
    width: var(--s);
    height: var(--s);
    border: .5cqmin solid rgba(36, 33, 63, .12);
    border-radius: 30%;
    rotate: var(--r);
    animation: drift 9s ease-in-out infinite alternate;
    animation-delay: var(--d);
  }
  @keyframes drift { to { translate: 0 -3cqmin; rotate: calc(var(--r) + 12deg); } }

  .card {
    position: relative;
    container-type: inline-size;
    width: min(92cqw, 520px, 72cqh);
    padding: 7cqi 7cqi 6cqi;
    border-radius: 6cqi;
    background: var(--card);
    box-shadow: 0 1px 0 rgba(36,33,63,.06), 0 3cqi 8cqi rgba(70, 50, 140, .18);
  }
  .brand { display: flex; align-items: center; gap: 2cqi; font-size: 3.4cqi; font-weight: 600; color: var(--soft); }
  .brand svg { width: 5cqi; height: 5cqi; }
  .title { margin-top: 3cqi; font-size: 7.6cqi; font-weight: 800; line-height: 1.05; letter-spacing: -.01em; }
  .sub { margin-top: 1.4cqi; font-size: 3.6cqi; color: var(--soft); line-height: 1.4; }

  .field { margin-top: 4.4cqi; }
  .field label { display: flex; justify-content: space-between; font-size: 3.3cqi; font-weight: 600; color: var(--soft); }
  .field label .eye { font-weight: 600; color: var(--ink); }
  .input {
    width: 100%;
    margin-top: 1.4cqi;
    padding: 2.8cqi 3.4cqi;
    border: .45cqi solid var(--line);
    border-radius: 3cqi;
    background: #faf9ff;
    font-size: 4.2cqi;
  }
  .input.pw { font-family: 'DM Mono', ui-monospace, monospace; font-weight: 500; letter-spacing: .02em; border-color: var(--c, var(--line)); transition: border-color .4s; }
  .input:focus { outline: none; border-color: var(--ink); }
  .input.pw::placeholder { color: #b3b0cc; }

  /* The meter: a track, a fill that springs to its new length, a face riding its tip. */
  .meter { position: relative; margin-top: 6.6cqi; }
  .track { height: 2.6cqi; border-radius: 99px; background: #eeedf8; }
  .fill {
    width: calc(var(--p, 0) * 1%);
    height: 100%;
    border-radius: inherit;
    background: var(--c, var(--line));
    transition: width .9s cubic-bezier(.3, 1.6, .5, 1), background-color .5s;
  }
  .face {
    position: absolute;
    top: 50%;
    left: calc(var(--p, 0) * 1%);
    width: 10cqi;
    height: 10cqi;
    translate: -50% -50%;
    transition: left .9s cubic-bezier(.3, 1.6, .5, 1);
  }
  .face svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .face .head { fill: var(--c, #cfcbe8); stroke: var(--ink); stroke-width: 3; transition: fill .5s; }
  .face [data-m] { display: none; }
  .face[data-mood="none"] [data-m~="none"],
  .face[data-mood="weak"] [data-m~="weak"],
  .face[data-mood="meh"] [data-m~="meh"],
  .face[data-mood="smirk"] [data-m~="smirk"],
  .face[data-mood="strong"] [data-m~="strong"],
  .face[data-mood="love"] [data-m~="love"] { display: inline; }
  .face .ln { fill: none; stroke: var(--ink); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
  .face .dot { fill: var(--ink); }

  /* The bubble hangs under the bar, its tail pointing up at the face. Room for two lines
     is kept so the form never jumps. */
  .talk { position: relative; min-height: 17cqi; margin-top: 8.2cqi; }
  .bubble {
    position: absolute;
    top: 0;
    left: clamp(0%, calc(var(--p, 0) * 1% - 30cqi), calc(100% - 64cqi));
    width: 64cqi;
    padding: 2.6cqi 3.6cqi;
    border: .5cqi solid var(--ink);
    border-radius: 4cqi;
    background: #fff;
    font-family: 'Sniglet', 'Rethink Sans', sans-serif;
    font-size: 4.2cqi;
    line-height: 1.2;
    transform-origin: var(--tail, 50%) -20%;
    transition: left .9s cubic-bezier(.3, 1.6, .5, 1);
  }
  .bubble::after {
    content: "";
    position: absolute;
    top: -2.4cqi;
    left: var(--tail, 50%);
    width: 4cqi;
    height: 4cqi;
    border-left: .5cqi solid var(--ink);
    border-top: .5cqi solid var(--ink);
    background: #fff;
    rotate: 45deg;
    translate: -50% 0;
  }
  .bubble.hide { opacity: 0; }
  .bubble > font-kku { color: var(--ink); }

  .verdict { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4.6cqi; font-size: 3.4cqi; color: var(--soft); }
  .verdict b { color: var(--ink); font-weight: 800; }
  .verdict > font-kku { color: var(--ink); }

  .go {
    width: 100%;
    margin-top: 3cqi;
    padding: 3cqi;
    border: 0;
    border-radius: 3cqi;
    background: var(--ink);
    color: #fff;
    font-size: 4.2cqi;
    font-weight: 800;
    cursor: pointer;
  }
  .go:hover { background: #3a3566; }
  .note { margin-top: 3cqi; font-size: 2.9cqi; line-height: 1.4; color: var(--soft); text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    .fill, .face, .bubble { transition: none; }
    .deco i { animation: none; }
  }
</style>
</head>
<body>
<div class="deco" aria-hidden="true">
  <i style="--s:9cqmin;--r:12deg;--d:-2s;left:8%;top:14%"></i>
  <i style="--s:5cqmin;--r:-20deg;--d:-5s;left:84%;top:10%"></i>
  <i style="--s:7cqmin;--r:30deg;--d:-1s;left:88%;top:72%"></i>
  <i style="--s:4cqmin;--r:8deg;--d:-7s;left:6%;top:80%"></i>
  <i style="--s:6cqmin;--r:-8deg;--d:-3s;left:46%;top:92%"></i>
</div>

<main class="card">
  <p class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3" fill="#24213f"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#24213f" stroke-width="2.4"/></svg>
    <span data-lang="en">totally-normal-signup.example</span>
    <span data-lang="ko">아주-평범한-가입.example</span>
  </p>
  <h1 class="title">
    <span data-lang="en">Create your account</span>
    <span data-lang="ko"><font-kku font="sticker" size="8.6cqi">계정 만들기</font-kku></span>
  </h1>
  <p class="sub">
    <span data-lang="en">Pick a password. The meter will have opinions.</span>
    <span data-lang="ko">비밀번호를 정해 주세요. 측정기가 한마디 할 거예요.</span>
  </p>

  <div class="field">
    <label for="email"><span data-lang="en">Email</span><span data-lang="ko">이메일</span></label>
    <input class="input" id="email" type="text" value="you@example.com" readonly tabindex="-1">
  </div>
  <div class="field">
    <label for="pw">
      <span data-lang="en">Password</span><span data-lang="ko">비밀번호</span>
      <span class="eye" aria-hidden="true"><span data-lang="en">shown, for science</span><span data-lang="ko">과학을 위해 보이는 중</span></span>
    </label>
    <input class="input pw" id="pw" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40">
  </div>

  <p class="verdict">
    <span><span data-lang="en">Strength: </span><span data-lang="ko">강도: </span><b class="mood-word"></b></span>
    <span class="score"></span>
  </p>
  <div class="meter">
    <div class="track"><div class="fill"></div></div>
    <div class="face" data-mood="none" aria-hidden="true">
      <svg viewBox="0 0 60 60">
        <circle class="head" cx="30" cy="30" r="26"/>
        <!-- eyes -->
        <g data-m="none meh weak"><circle class="dot" cx="21" cy="26" r="3.2"/><circle class="dot" cx="39" cy="26" r="3.2"/></g>
        <g data-m="smirk"><path class="ln" d="M16 26 h9 M35 25 h9"/></g>
        <g data-m="strong"><rect x="12" y="20" width="15" height="10" rx="3" fill="#24213f"/><rect x="33" y="20" width="15" height="10" rx="3" fill="#24213f"/><path class="ln" d="M27 24 h6"/></g>
        <g data-m="love"><path class="ln" d="M16 27 q5 -6 10 0 M34 27 q5 -6 10 0"/><path d="M45 31 q2 6 -1 9" fill="none" stroke="#5bb7ff" stroke-width="3" stroke-linecap="round"/></g>
        <!-- mouths -->
        <path data-m="none" class="ln" d="M22 40 h16"/>
        <path data-m="weak" class="ln" d="M20 42 l4 -3 4 3 4 -3 4 3 4 -3"/>
        <path data-m="meh" class="ln" d="M21 41 q9 -3 18 1"/>
        <path data-m="smirk" class="ln" d="M21 41 q10 2 18 -5"/>
        <path data-m="strong" class="ln" d="M20 39 q10 9 20 0"/>
        <path data-m="love" class="ln" d="M21 39 q9 7 18 0"/>
      </svg>
    </div>
  </div>

  <div class="talk"><div class="bubble hide" aria-live="polite"></div></div>

  <button class="go" type="button"><span data-lang="en">Sign up</span><span data-lang="ko">가입하기</span></button>
  <p class="note">
    <span data-lang="en">Nothing you type leaves this page. Even the meter forgets.</span>
    <span data-lang="ko">입력한 건 이 페이지 밖으로 나가지 않아요. 측정기도 금방 잊어요.</span>
  </p>
</main>

<script>
(() => {
  document.title = TTY.t({ en: 'A Password Meter With Feelings', ko: '감정 있는 비밀번호 측정기' }) + ' | tty.link';
  const ko = TTY.lang === 'ko';
  const card = document.querySelector('.card');
  const pw = document.getElementById('pw');
  const bubble = document.querySelector('.bubble');
  const face = document.querySelector('.face');
  const moodWord = document.querySelector('.mood-word');
  const score = document.querySelector('.score');

  const COLORS = { none: '', weak: 'var(--weak)', meh: 'var(--meh)', smirk: 'var(--smirk)', strong: 'var(--strong)', love: 'var(--love)' };
  const WORDS = {
    en: { weak: 'weak', meh: 'meh', smirk: 'suspicious', strong: 'strong', love: 'touching' },
    ko: { weak: '약함', meh: '애매함', smirk: '수상함', strong: '강함', love: '뭉클함' },
  };
  const KO_FONT = { weak: 'dunggeun', meh: 'dunggeun', smirk: 'dunggeun', strong: 'dunggeun', love: 'dunggeun' };

  const SCRIPT = TTY.t({
    en: [
      { pw: 'password', p: 12, mood: 'weak', say: "Weak. Also, it's everyone's." },
      { pw: 'Password1!', p: 34, mood: 'smirk', say: 'We see what you did there.' },
      { pw: 'P@ssw0rd', p: 40, mood: 'meh', say: 'A classic. Like a cardigan.' },
      { pw: 'correct horse battery staple', p: 96, mood: 'strong', say: 'Strong. And now everyone knows it.' },
      { pw: 'ilovemymom', p: 24, mood: 'love', say: 'Weak password. Strong person.' },
    ],
    ko: [
      { pw: 'password', p: 12, mood: 'weak', say: '약해요. 그리고 전 국민이 써요.' },
      { pw: 'qwer1234', p: 20, mood: 'meh', say: '키보드 왼쪽 위에서 출발하셨군요.' },
      { pw: 'P@ssw0rd', p: 38, mood: 'smirk', say: 'a를 @로 바꾸면 모를 줄 아셨죠?' },
      { pw: 'dkssudgktpdy', p: 58, mood: 'smirk', say: '안녕하세요를 영타로 치셨네요. 다 보여요.' },
      { pw: 'correct horse battery staple', p: 96, mood: 'strong', say: '강력해요. 근데 이제 다 같이 알아요.' },
      { pw: '엄마생신0412', p: 24, mood: 'love', say: '비밀번호는 약한데, 효심이 강하네요.' },
    ],
  });

  // Reactions for whatever a visitor types themselves.
  const OWN = TTY.t({
    en: {
      common: ['That one is in every dictionary. The hacking kind.', 'Popular choice. That is the problem.'],
      repeat: 'One key, held with conviction.',
      count: 'Counting is not encryption.',
      short: 'Short and sweet. Mostly short.',
      long: 'Long. Good. Now write it nowhere.',
      meh: ['Fine. Like a Tuesday.', "Not bad. You'll forget it, which is the point.", 'Decent. The meter is cautiously optimistic.'],
      signup: 'Nothing was saved. Your secret is safe with nobody.',
    },
    ko: {
      common: ['그건 사전에도 있어요. 해커들 사전에요.', '인기 많은 비밀번호예요. 그게 문제예요.'],
      repeat: '한 키를 아주 꾹 누르셨네요.',
      count: '숫자 세기는 암호화가 아니에요.',
      short: '짧고 굵게… 아니 그냥 짧아요.',
      long: '길어요, 좋아요. 이제 아무 데도 적지 마세요.',
      meh: ['무난해요. 화요일처럼.', '나쁘지 않아요. 곧 잊으실 텐데, 그게 맞아요.', '괜찮아요. 측정기가 조심스럽게 기대하는 중.'],
      signup: '아무것도 저장되지 않았어요. 비밀은 지켜졌어요.',
    },
  });
  const COMMON = ['password', '123456', '12345678', 'qwerty', 'qwer1234', '1q2w3e4r', 'iloveyou', 'admin', 'letmein', '111111', 'abc123', 'password1'];
  const pickOne = (list) => list[Math.floor(Math.random() * list.length)];

  function say(text, mood, p) {
    card.style.setProperty('--p', p);
    card.style.setProperty('--c', COLORS[mood]);
    face.dataset.mood = mood;
    pw.style.setProperty('--c', COLORS[mood] || '');
    moodWord.textContent = mood === 'none' ? '' : WORDS[TTY.lang][mood];
    score.textContent = mood === 'none' ? '' : `${Math.round(p)}/100`;
    // The bubble's tail points at the face wherever the bubble ends up.
    requestAnimationFrame(() => {
      const meter = document.querySelector('.meter').getBoundingClientRect();
      const b = bubble.getBoundingClientRect();
      const faceX = meter.left + meter.width * p / 100;
      const tail = Math.max(10, Math.min(90, ((faceX - b.left) / b.width) * 100));
      bubble.style.setProperty('--tail', tail + '%');
    });
    if (!text) { bubble.classList.add('hide'); return; }
    if (ko) {
      const el = document.createElement('font-kku');
      el.setAttribute('font', KO_FONT[mood] || 'dunggeun');
      el.setAttribute('size', '4.6cqi');
      el.setAttribute('wrap-unit', 'word');
      el.textContent = text;
      bubble.replaceChildren(el);
    } else {
      bubble.textContent = text;
    }
    bubble.classList.remove('hide');
    if (!TTY.reduce) {
      bubble.animate([{ transform: 'scale(.6) rotate(-4deg)', opacity: 0 }, { transform: 'scale(1.06) rotate(1deg)', opacity: 1, offset: .6 }, { transform: 'none', opacity: 1 }], { duration: 520, easing: 'cubic-bezier(.2,.9,.3,1.2)' });
      face.animate([{ transform: 'translateY(0) rotate(0)' }, { transform: 'translateY(-18%) rotate(-10deg)' }, { transform: 'translateY(0) rotate(6deg)' }, { transform: 'none' }], { duration: 600, easing: 'ease-out' });
    }
  }

  /* ---- The meter watches someone choose, attempt after attempt ---- */
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  let auto = true;
  let run = 0;

  async function typeOut(text, mine) {
    while (pw.value.length) {
      if (!auto || run !== mine) return false;
      pw.value = pw.value.slice(0, -1);
      await wait(22);
    }
    for (const ch of text) {
      if (!auto || run !== mine) return false;
      pw.value += ch;
      await wait(ch === ' ' ? 140 : 60 + Math.random() * 70);
    }
    return true;
  }

  async function play() {
    const mine = ++run;
    while (auto && run === mine) {
      for (const step of SCRIPT) {
        if (!auto || run !== mine) return;
        say('', 'none', 0);
        if (!(await typeOut(step.pw, mine))) return;
        await wait(260);
        if (!auto || run !== mine) return;
        say(step.say, step.mood, step.p);
        await wait(step === SCRIPT[SCRIPT.length - 1] ? 4200 : 2500);
      }
    }
  }

  /* ---- A visitor types their own ---- */
  function judge(value) {
    const v = value.trim();
    if (!v) return say('', 'none', 0);
    const lower = v.toLowerCase();
    const variety = [/[a-z]/, /[A-Z]/, /\d/, /[^A-Za-z0-9]/].filter((r) => r.test(v)).length;
    let p = Math.min(100, v.length * 5 + variety * 8);
    if (COMMON.includes(lower)) return say(pickOne(OWN.common), 'weak', 10);
    if (/^(.)\1+$/.test(v)) return say(OWN.repeat, 'weak', 8);
    if (/123|234|abc|qwer|asdf/i.test(v)) return say(OWN.count, 'meh', Math.min(p, 30));
    if (v.length < 8) return say(OWN.short, 'weak', Math.min(p, 22));
    if (v.length >= 16) return say(OWN.long, 'strong', Math.max(p, 85));
    say(pickOne(OWN.meh), p > 55 ? 'smirk' : 'meh', p);
  }
  let judging;
  pw.addEventListener('input', () => {
    if (auto) { auto = false; run++; }
    clearTimeout(judging);
    judging = setTimeout(() => judge(pw.value), 280);
  });
  pw.addEventListener('focus', () => {
    if (!auto) return;
    auto = false; run++;
    pw.value = '';
    say('', 'none', 0);
    pw.placeholder = TTY.t({ en: 'Type a password', ko: '비밀번호를 입력해 보세요' });
  });
  document.querySelector('.go').addEventListener('click', () => {
    if (auto) { auto = false; run++; }
    say(OWN.signup, 'love', Math.max(parseFloat(card.style.getPropertyValue('--p')) || 0, 50));
  });

  if (TTY.reduce) {
    const last = SCRIPT[SCRIPT.length - 1];
    pw.value = last.pw;
    say(last.say, last.mood, last.p);
  } else {
    say('', 'none', 0);
  }

  TTY.onShow(() => { if (!TTY.reduce) setTimeout(play, 500); });
  const loaded = new Promise((r) => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
  Promise.all([loaded, document.fonts.ready]).then(TTY.ready);
})();
</script>
</body>
</html>
