<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Password Meter With Feelings | tty.link</title>
<script src="/pages/_kit.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;600;800&family=Sniglet:wght@400;800&family=DM+Mono:wght@500&family=Gowun+Dodum&display=swap">
<script src="https://font.tty.link/lib/font-kku.js" data-fonts="sticker dunggeun"></script>
<style>
  /* A sign-up form whose strength meter is not a judge but a friend with opinions.
     The meter's face rides the end of the bar; its words come out in a bubble. */
  :root {
    --bg-1: #e4e2ff;
    --bg-2: #ffe1ec;
    --card: #ffffff;
    --ink: #24213f;
    --soft: #6c6890;
    --line: #dcd9f2;
    --weak: #ff5a5f;
    --meh: #ff9f1c;
    --smirk: #f5c518;
    --strong: #22b8a6;
    --love: #ff6fae;
    --worried: #9b8cff;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    container: stage / size;
    display: grid;
    place-items: center;
    overflow: hidden;
    background:
      radial-gradient(60cqmax 60cqmax at 12% 18%, rgba(255,255,255,.55), transparent 60%),
      linear-gradient(140deg, var(--bg-1), var(--bg-2));
    color: var(--ink);
    font-family: 'Rethink Sans', 'Gowun Dodum', system-ui, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 10px; }
  .lang-ko body { font-family: 'Gowun Dodum', 'Rethink Sans', sans-serif; word-break: keep-all; }
  .lang-ko .title { margin-top: 4.6cqi; }

  /* Floating shapes behind the card: keys and padlocks, quietly drifting. */
  .deco { position: absolute; inset: 0; pointer-events: none; }
  .deco i {
    position: absolute;
    width: var(--s);
    height: var(--s);
    border: .5cqmin solid rgba(36, 33, 63, .12);
    border-radius: 30%;
    rotate: var(--r);
    animation: drift 9s ease-in-out infinite alternate;
    animation-delay: var(--d);
  }
  @keyframes drift { to { translate: 0 -3cqmin; rotate: calc(var(--r) + 12deg); } }

  .card {
    position: relative;
    container-type: inline-size;
    width: min(92cqw, 520px, 72cqh);
    padding: 7cqi 7cqi 6cqi;
    border-radius: 6cqi;
    background: var(--card);
    box-shadow: 0 1px 0 rgba(36,33,63,.06), 0 3cqi 8cqi rgba(70, 50, 140, .18);
  }
  .brand { display: flex; align-items: center; gap: 2cqi; font-size: max(10px, 3.4cqi); font-weight: 600; color: var(--soft); }
  .brand svg { width: 5cqi; height: 5cqi; }
  .title { margin-top: 3cqi; font-size: 5cqi; font-weight: 800; line-height: 1.05; letter-spacing: -.01em; }
  .sub { margin-top: 1.4cqi; font-size: max(10px, 3.6cqi); color: var(--soft); line-height: 1.4; }

  .field { margin-top: 4.4cqi; }
  .field label { display: flex; justify-content: space-between; font-size: max(10px, 3.3cqi); font-weight: 600; color: var(--soft); }
  .field label .eye { font-weight: 600; color: var(--ink); }
  .input {
    width: 100%;
    margin-top: 1.4cqi;
    padding: 2.8cqi 3.4cqi;
    border: .45cqi solid var(--line);
    border-radius: 3cqi;
    background: #faf9ff;
    font-size: 4.2cqi;
  }
  .input.pw { font-family: 'DM Mono', ui-monospace, monospace; font-weight: 500; letter-spacing: .02em; border-color: var(--c, var(--line)); transition: border-color .4s; }
  .input:focus { outline: none; border-color: var(--ink); }
  .input.pw::placeholder { color: #b3b0cc; }

  /* The meter: a track, a fill that springs to its new length, a face riding its tip. */
  .meter { position: relative; margin-top: 6.6cqi; }
  .track { height: 2.6cqi; border-radius: 99px; background: #eeedf8; }
  .fill {
    width: calc(var(--p, 0) * 1%);
    height: 100%;
    border-radius: inherit;
    background: var(--c, var(--line));
    transition: width .9s cubic-bezier(.3, 1.6, .5, 1), background-color .5s;
  }
  .face {
    position: absolute;
    top: 50%;
    left: calc(var(--p, 0) * 1%);
    width: 10cqi;
    height: 10cqi;
    translate: -50% -50%;
    transition: left .9s cubic-bezier(.3, 1.6, .5, 1);
  }
  .face svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .face .head { fill: var(--c, #cfcbe8); stroke: var(--ink); stroke-width: 3; transition: fill .5s; }
  .face [data-m] { display: none; }
  .face[data-mood="none"] [data-m~="none"],
  .face[data-mood="weak"] [data-m~="weak"],
  .face[data-mood="meh"] [data-m~="meh"],
  .face[data-mood="smirk"] [data-m~="smirk"],
  .face[data-mood="strong"] [data-m~="strong"],
  .face[data-mood="love"] [data-m~="love"],
  .face[data-mood="worried"] [data-m~="worried"] { display: inline; }
  .face .ln { fill: none; stroke: var(--ink); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
  .face .dot { fill: var(--ink); }
  /* The touched face keeps crying while the ending holds, so the last scene is never a still. */
  .face .tear { animation: drip 1.8s ease-in infinite; }
  @keyframes drip { 0%, 30% { translate: 0 0; opacity: 1; } 100% { translate: 0 16px; opacity: 0; } }

  /* The bubble hangs under the bar, its tail pointing up at the face. Room for two lines
     is kept so the form never jumps. The jokes ride in it, so its letters are as large as the
     form's title (5cqi, font-kku 5.4cqi in Korean); a title twice its size took the eye first. */
  .talk { position: relative; min-height: 19cqi; margin-top: 8.2cqi; }
  .bubble {
    position: absolute;
    top: 0;
    left: clamp(0%, calc(var(--p, 0) * 1% - 39cqi), calc(100% - 78cqi));
    width: 78cqi;
    padding: 2.6cqi 3.6cqi;
    border: .5cqi solid var(--ink);
    border-radius: 4cqi;
    background: #fff;
    font-family: 'Sniglet', 'Rethink Sans', sans-serif;
    font-size: 5cqi;
    line-height: 1.2;
    transform-origin: var(--tail, 50%) -20%;
    transition: left .9s cubic-bezier(.3, 1.6, .5, 1);
  }
  .bubble::after {
    content: "";
    position: absolute;
    top: -2.4cqi;
    left: var(--tail, 50%);
    width: 4cqi;
    height: 4cqi;
    border-left: .5cqi solid var(--ink);
    border-top: .5cqi solid var(--ink);
    background: #fff;
    rotate: 45deg;
    translate: -50% 0;
  }
  .bubble.hide { opacity: 0; }
  .bubble > font-kku { color: var(--ink); }

  .verdict { display: flex; justify-content: space-between; align-items: baseline; gap: 3cqi; margin-top: 4.6cqi; font-size: max(10px, 3.4cqi); color: var(--soft); white-space: nowrap; }
  .verdict b { color: var(--ink); font-weight: 800; }
  /* The cold half of the verdict: how long the guess would take, beside how the meter feels. */
  .verdict .crack { font-family: 'DM Mono', ui-monospace, monospace; font-size: max(10px, 3.1cqi); }
  .lang-ko .verdict .crack { font-family: 'Gowun Dodum', sans-serif; font-size: max(10px, 3.4cqi); }
  .verdict > font-kku { color: var(--ink); }

  .go {
    width: 100%;
    margin-top: 3cqi;
    padding: 3cqi;
    border: 0;
    border-radius: 3cqi;
    background: var(--ink);
    color: #fff;
    font-size: 4.2cqi;
    font-weight: 800;
    cursor: pointer;
  }
  .go:hover { background: #3a3566; }
  /* After a mom (or dad) password the meter, moved, repurposes the form's own button. */
  .go.call { background: var(--love); color: var(--ink); }
  .go.call:hover { background: #ff86bb; }
  .note { margin-top: 3cqi; font-size: max(10px, 2.9cqi); line-height: 1.4; color: var(--soft); text-align: center; }

  /* Short stages (a phone's 358 × 396, a landscape 800 × 450): the card was held to 72cqh
     and everything in it shrank to 7 px. Here the readonly email row steps aside and the
     padding tightens, so the card can be wider. The small lines above carry 10 px floors
     everywhere (a 360 × 520 window had the crack time at 8.7 px). */
  @container stage (max-height: 700px) and (min-aspect-ratio: 3/4) {
    .card { width: min(92cqw, 520px, 84cqh); padding: clamp(14px, 3.4cqmin, 32px) clamp(16px, 4cqmin, 36px) clamp(12px, 3cqmin, 28px); }
    .field.email { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fill, .face, .bubble { transition: none; }
    .deco i, .face .tear { animation: none; }
  }
</style>
</head>
<body>
<div class="deco" aria-hidden="true">
  <i style="--s:9cqmin;--r:12deg;--d:-2s;left:8%;top:14%"></i>
  <i style="--s:5cqmin;--r:-20deg;--d:-5s;left:84%;top:10%"></i>
  <i style="--s:7cqmin;--r:30deg;--d:-1s;left:88%;top:72%"></i>
  <i style="--s:4cqmin;--r:8deg;--d:-7s;left:6%;top:80%"></i>
  <i style="--s:6cqmin;--r:-8deg;--d:-3s;left:46%;top:92%"></i>
</div>

<main class="card">
  <p class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3" fill="#24213f"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#24213f" stroke-width="2.4"/></svg>
    <span data-lang="en">totally-normal-signup.example</span>
    <span data-lang="ko">아주-평범한-가입.example</span>
  </p>
  <h1 class="title">
    <span data-lang="en">Create your account</span>
    <span data-lang="ko"><font-kku font="sticker" size="5.4cqi">계정 만들기</font-kku></span>
  </h1>
  <p class="sub">
    <span data-lang="en">Pick a password. The meter will have opinions.</span>
    <span data-lang="ko">비밀번호를 정해 주세요. 측정기가 한마디 할 거예요.</span>
  </p>

  <div class="field email">
    <label for="email"><span data-lang="en">Email</span><span data-lang="ko">이메일</span></label>
    <input class="input" id="email" type="text" value="you@example.com" readonly tabindex="-1">
  </div>
  <div class="field">
    <label for="pw">
      <span data-lang="en">Password</span><span data-lang="ko">비밀번호</span>
      <span class="eye" aria-hidden="true"><span data-lang="en">shown, for science</span><span data-lang="ko">과학을 위해 보이는 중</span></span>
    </label>
    <input class="input pw" id="pw" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40">
  </div>

  <p class="verdict">
    <span><span data-lang="en">Strength: </span><span data-lang="ko">강도: </span><b class="mood-word"></b></span>
    <span class="crack"></span>
  </p>
  <div class="meter">
    <div class="track"><div class="fill"></div></div>
    <div class="face" data-mood="none" aria-hidden="true">
      <svg viewBox="0 0 60 60">
        <circle class="head" cx="30" cy="30" r="26"/>
        <!-- eyes -->
        <g data-m="none meh weak"><circle class="dot" cx="21" cy="26" r="3.2"/><circle class="dot" cx="39" cy="26" r="3.2"/></g>
        <g data-m="smirk"><path class="ln" d="M16 26 h9 M35 25 h9"/></g>
        <g data-m="strong"><rect x="12" y="20" width="15" height="10" rx="3" fill="#24213f"/><rect x="33" y="20" width="15" height="10" rx="3" fill="#24213f"/><path class="ln" d="M27 24 h6"/></g>
        <g data-m="love"><path class="ln" d="M16 27 q5 -6 10 0 M34 27 q5 -6 10 0"/><path class="tear" d="M45 30 q6 8 0 12 q-6 -4 0 -12 z" fill="#5bb7ff" stroke="#24213f" stroke-width="2" stroke-linejoin="round"/></g>
        <g data-m="worried"><circle class="dot" cx="21" cy="27" r="3.8"/><circle class="dot" cx="39" cy="27" r="3.8"/><path class="ln" d="M14 20 L24 16 M46 20 L36 16"/></g>
        <!-- mouths -->
        <path data-m="none" class="ln" d="M22 40 h16"/>
        <path data-m="weak" class="ln" d="M20 42 l4 -3 4 3 4 -3 4 3 4 -3"/>
        <path data-m="meh" class="ln" d="M21 41 q9 -3 18 1"/>
        <path data-m="smirk" class="ln" d="M21 41 q10 2 18 -5"/>
        <path data-m="strong" class="ln" d="M20 39 q10 9 20 0"/>
        <path data-m="love" class="ln" d="M21 39 q9 7 18 0"/>
        <path data-m="worried" class="ln" d="M21 42 q4.5 -3 9 0 q4.5 3 9 0"/>
      </svg>
    </div>
  </div>

  <div class="talk"><div class="bubble hide" aria-live="polite"></div></div>

  <button class="go" type="button"><span data-lang="en">Sign up</span><span data-lang="ko">가입하기</span></button>
  <p class="note">
    <span data-lang="en">Nothing you type leaves this page. Even the meter forgets.</span>
    <span data-lang="ko">입력한 건 이 페이지 밖으로 나가지 않아요. 측정기도 금방 잊어요.</span>
  </p>
</main>

<script>
(() => {
  document.title = TTY.t({ en: 'A Password Meter With Feelings', ko: '감정 있는 비밀번호 측정기' }) + ' | tty.link';
  const ko = TTY.lang === 'ko';
  const card = document.querySelector('.card');
  const pw = document.getElementById('pw');
  const bubble = document.querySelector('.bubble');
  const talk = document.querySelector('.talk');
  const face = document.querySelector('.face');
  const moodWord = document.querySelector('.mood-word');
  const crackEl = document.querySelector('.crack');

  const COLORS = { none: '', weak: 'var(--weak)', meh: 'var(--meh)', smirk: 'var(--smirk)', strong: 'var(--strong)', love: 'var(--love)', worried: 'var(--worried)' };
  const WORDS = {
    en: { weak: 'weak', meh: 'meh', smirk: 'suspicious', strong: 'strong', love: 'touching', worried: 'worried' },
    ko: { weak: '약함', meh: '애매함', smirk: '수상함', strong: '강함', love: '뭉클함', worried: '걱정됨' },
  };
  const KO_FONT = { weak: 'dunggeun', meh: 'dunggeun', smirk: 'dunggeun', strong: 'dunggeun', love: 'dunggeun', worried: 'dunggeun' };

  /* The script. Every face differs from the one before it, and bar and crack time agree: a
     longer bar never cracks sooner (12 instantly, 28 in 1 s, 34 in 2 s, 38 in 3 s). The xkcd
     step has a second beat (`after`, 1.5 s later): the full bar collapses once the meter
     remembers the comic, so the joke reads without the words. */
  const SCRIPT = TTY.t({
    en: [
      { pw: 'password', p: 12, mood: 'weak', crack: 'cracked instantly', say: "Weak. Also, it's everyone's." },
      { pw: 'Password1!', p: 34, mood: 'smirk', crack: 'cracked in 2 seconds', say: 'Follows every rule. So does everyone else.' },
      { pw: 'P@ssw0rd', p: 28, mood: 'meh', crack: 'cracked in 1 second', say: 'That @ is doing a lot of heavy lifting.' },
      { pw: 'correct horse battery staple', p: 96, mood: 'strong', crack: 'safe for centuries', say: 'Strong.',
        after: { p: 14, mood: 'worried', crack: 'uncrackable until 2011', say: 'Strong. And now everyone knows it.' } },
      { pw: 'ilovemymom', p: 38, mood: 'love', crack: 'cracked in 3 seconds', say: 'Weak password. Strong person.', call: 'mom' },
    ],
    ko: [
      { pw: 'qwer1234', p: 12, mood: 'weak', crack: '즉시 뚫림', say: '키보드 왼쪽 위에서 출발하셨군요.' },
      { pw: 'P@ssw0rd', p: 28, mood: 'meh', crack: '1초면 뚫림', say: 'a를 @로 바꾸면 모를 줄 아셨죠?' },
      { pw: 'dkssudgktpdy', p: 16, mood: 'smirk', crack: '즉시 뚫림', say: '안녕하세요를 영타로 치셨네요. 다 보여요.' },
      { pw: 'correct horse battery staple', p: 96, mood: 'strong', crack: '수백 년 버팀', say: '강력해요.',
        after: { p: 14, mood: 'worried', crack: '2011년까진 안전했음', say: '강력해요. 근데 이제 다 같이 알아요.' } },
      { pw: '엄마생신0412', p: 38, mood: 'love', crack: '3초면 뚫림', say: '비밀번호는 약한데, 효심이 강하네요.', call: 'mom' },
    ],
  });
  const LAST = SCRIPT[SCRIPT.length - 1];
  // The tag beat: a moment after a mom (or dad) password, the sign-up button changes its mind.
  const BUTTON = TTY.t({
    en: { signup: 'Sign up', mom: 'Call your mom', dad: 'Call your dad' },
    ko: { signup: '가입하기', mom: '엄마한테 전화하기', dad: '아빠한테 전화하기' },
  });

  // Reactions for whatever a visitor types themselves.
  const OWN = TTY.t({
    en: {
      common: ['Popular choice. That is the problem.', 'A crowd favorite. Hackers start with the crowd.'],
      dict: {
        word: "It's in the dictionary. The hacker's, too.",
        digits: 'A word plus numbers? Hackers try that second.',
        dressed: 'Same word, nicer outfit.',
        leet: 'Swapping in look-alikes fools people, not hackers.',
        keys: (w) => `“${w}” typed in English mode? Hackers know.`,
      },
      repeat: 'One key, held with conviction.',
      count: 'Counting is not encryption.',
      row: 'Typing along a keyboard row? Hackers start there.',
      short: 'Short and sweet. Mostly short.',
      long: 'Long. Good. Now write it nowhere.',
      meh: ['Fine. Like a Tuesday.', "Not bad. You'll forget it, which is the point.", 'Decent. The meter is cautiously optimistic.'],
      mom: ['Weak password. Strong person.', 'Your mom would be proud. Your security team would not.'],
      dad: 'Dad will love it. So will hackers.',
      birthday: 'Hackers remember birthdays too.',
      angel: 'Oh! 1004 reads “angel” in Korean. Hackers read digits.',
      troubadour: 'Hard to remember, easy to guess. The famous one.',
      signup: 'Nothing was saved. Your secret is safe with nobody.',
      call: "I'd dial for you, but I'm just a bar.",
    },
    ko: {
      common: ['인기 많은 비밀번호예요. 그게 문제예요.', '다들 쓰는 거예요. 해커도 거기서 시작해요.'],
      dict: {
        word: '사전에 있는 단어네요. 해커 사전에도요.',
        digits: '단어에 숫자 붙이기, 해커도 다 해 봐요.',
        dressed: '옷만 갈아입은 단어예요. 해커는 알아봐요.',
        leet: '닮은 글자로 바꿔도 해커 눈엔 그대로예요.',
        keys: (w) => `${w}${objectParticle(w)} 영타로 치셨네요. 해커도 알아봐요.`,
      },
      repeat: '한 키를 아주 꾹 누르셨네요.',
      count: '숫자 세기는 암호화가 아니에요.',
      row: '자판 한 줄 그대로네요. 해커도 거기부터 봐요.',
      short: '짧고 굵게… 아니 그냥 짧아요.',
      long: '길어요, 좋아요. 이제 아무 데도 적지 마세요.',
      meh: ['무난해요. 흰 티 같은 비밀번호네요.', '나쁘지 않아요. 본인도 못 외울 만큼요.', '괜찮아요. 측정기가 조심스럽게 기대하는 중.'],
      mom: ['비밀번호는 약한데, 효심이 강하네요.', '어머님은 감동하시겠지만, 보안팀은 아니에요.'],
      dad: '아빠가 좋아하시겠어요. 해커도요.',
      birthday: '생일은 해커도 챙겨요.',
      angel: '아, 천사(1004)군요. 해커는 천사도 숫자로 봐요.',
      troubadour: '외우긴 어렵고 뚫기는 쉬운, 바로 그 비밀번호네요.',
      signup: '저장된 건 없어요. 저도 벌써 잊었어요.',
      call: '제가 걸어 드리고 싶은데, 전 막대라서요.',
    },
  });
  const COMMON = ['password', '123456', '12345678', 'qwerty', 'qwer1234', '1q2w3e4r', 'iloveyou', 'admin', 'letmein', '111111', 'abc123', 'password1'];

  /* ---- The cracker's dictionary ----
     A dictionary attack tries real words first, then the same words with the usual
     dressing: a capital, digits or a symbol on the end, look-alike swaps (0 for o, @ for a).
     These are some of the words it reaches in the first instant: common English words,
     Korean words in romanisation, and Korean words typed with the keyboard still in
     English mode (두벌식 keys: 사랑 → tkfkd), which is computed below from the Hangul. */
  const EN_WORDS = (
    'love lovely lover loveme sunshine sunflower flower flowers butterfly rainbow princess prince queen king angel ' +
    'dragon monkey shadow master football baseball soccer hockey basketball tennis golf ninja pirate wizard magic ' +
    'hunter killer ranger soldier warrior knight hero legend tiger lion eagle falcon wolf bear puppy doggy kitty ' +
    'kitten horse dolphin panda rabbit bunny turtle unicorn phoenix monster zombie vampire ghost thunder lightning ' +
    'storm snow snowball winter summer spring autumn freedom welcome hello whatever nothing secret dream dreams ' +
    'dreamer star stars moon sunny ocean river forest mountain sky cookie chocolate cheese banana apple orange ' +
    'lemon cherry strawberry peanut pepper honey sugar candy coffee pizza burger cupcake muffin pumpkin peach mango ' +
    'coconut smile happy happiness lucky sweet sweetie sweetheart darling baby babygirl babyboy friend friends ' +
    'family forever always together beautiful pretty cute silver golden purple yellow green blue black white red ' +
    'pink diamond crystal jasmine rose lily daisy tulip violet music guitar piano dance party gamer player matrix ' +
    'hacker security network server system computer internet office school college student teacher doctor money ' +
    'dollar million spider rocket space galaxy planet earth fire water ice cowboy captain pilot login access guest ' +
    'test user default changeme trustno letmein iloveyou'
  ).split(' ');
  const KO_ROMAN = (
    'sarang saranghae saranghaeyo saranghe annyeong annyong annyeonghaseyo haengbok haengun gamsa gamsahamnida ' +
    'kamsahamnida hangeul hangul hanguk daehanminguk seoul busan kimchi bibimbap oppa eonni unnie nuna noona hyung ' +
    'appa umma halmeoni chingu haneul bada byeol kkot maeum jagi jagiya yeobo gongju wangja hwaiting fighting ' +
    'daebak choego jjang cheonsa kkum huimang jayu gajok tokki horangi bimil sowon yeongwonhi bogoshipeo gwiyomi'
  ).split(' ');
  const KO_HANGUL = (
    '사랑 사랑해 사랑해요 안녕 안녕하세요 행복 행운 감사 감사합니다 한글 한국 대한민국 비밀번호 관리자 로그인 ' +
    '하늘 바다 별 꽃 마음 친구 자기 자기야 여보 공주 왕자 오빠 언니 누나 형 아빠 고양이 강아지 바보 화이팅 ' +
    '파이팅 보고싶어 김치 서울 부산 축구 야구 햇살 우리 하나 천사 비밀 영원히 소원 귀요미 뽀뽀 최고 대박 ' +
    '가족 자유 희망 꿈 무지개 토끼 호랑이 사과 딸기 수박 봄 여름 가을 겨울 짱'
  ).split(' ');
  // Hangul → the keys a 두벌식 keyboard would type in English mode (lowercase, as compared).
  const CHO = 'rRseEfaqQtTdwWczxvg';
  const JUNG = ['k', 'o', 'i', 'O', 'j', 'p', 'u', 'P', 'h', 'hk', 'ho', 'hl', 'y', 'n', 'nj', 'np', 'nl', 'b', 'm', 'ml', 'l'];
  const JONG = ['', 'r', 'R', 'rt', 's', 'sw', 'sg', 'e', 'f', 'fr', 'fa', 'fq', 'ft', 'fx', 'fv', 'fg', 'a', 'q', 'qt', 't', 'T', 'd', 'w', 'c', 'z', 'x', 'v', 'g'];
  const keysOf = (word) => [...word].map((ch) => {
    const i = ch.charCodeAt(0) - 0xac00;
    return i >= 0 && i < 11172 ? CHO[Math.floor(i / 588)] + JUNG[Math.floor((i % 588) / 28)] + JONG[i % 28] : ch;
  }).join('').toLowerCase();
  const DICT = new Set([...EN_WORDS, ...COMMON, ...KO_ROMAN, ...KO_HANGUL]);
  const KEYS = new Map(KO_HANGUL.map((w) => [keysOf(w), w]));
  // 을 after a final consonant, 를 after a vowel.
  function objectParticle(w) {
    const i = w.charCodeAt(w.length - 1) - 0xac00;
    return i >= 0 && i < 11172 && i % 28 ? '을' : '를';
  }
  /* A dictionary word, maybe dressed: up to four digits or one or two symbols in front, up to
     four digits and four symbols behind, any capitals, look-alike swaps. Returns how it was
     dressed ('word'; 'digits' only; 'dressed' with a capital or a symbol; 'leet'; or 'keys'
     with the Hangul it spells), or null. */
  const SYM = '[!-\\/:-@\\[-`{-~]';
  const SPLIT = new RegExp(`^(\\d{0,4}|${SYM}{0,2})(.+?)(\\d{0,4}${SYM}{0,4}|${SYM}{0,4}\\d{0,4})$`);
  const unleet = (w, one) => w.replace(/[@4]/g, 'a').replace(/0/g, 'o').replace(/3/g, 'e').replace(/[$5]/g, 's').replace(/7/g, 't').replace(/[1!]/g, one);
  function inDictionary(v) {
    const m = v.match(SPLIT);
    if (!m) return null;
    const [, head, core, tail] = m;
    const word = core.toLowerCase();
    const extra = head + tail;
    const dressed = core !== word || new RegExp(SYM).test(extra);
    const how = dressed ? 'dressed' : extra ? 'digits' : 'word';
    if (DICT.has(word)) return { how };
    if (KEYS.has(word)) return { how: 'keys', hangul: KEYS.get(word) };
    if (/[0-9@$!]/.test(word) && (DICT.has(unleet(word, 'i')) || DICT.has(unleet(word, 'l')))) return { how: 'leet' };
    return null;
  }
  const pickOne = (list) => list[Math.floor(Math.random() * list.length)];

  // How long an offline guess would take, the way strength meters estimate it: every
  // combination of the character kinds used, at ten billion guesses a second (one GPU rig
  // against a fast hash). Patterns a cracker tries first get a few seconds at most.
  const CRACK = TTY.t({
    en: {
      instant: 'cracked instantly',
      unit: (n, u) => `cracked in ${n} ${u}${n === 1 ? '' : 's'}`,
      units: ['second', 'minute', 'hour', 'day', 'month', 'year'],
      ages: 'safe for centuries',
    },
    ko: {
      instant: '즉시 뚫림',
      unit: (n, u) => `${n}${u}면 뚫림`,
      units: ['초', '분이', '시간이', '일이', '개월이', '년이'],
      ages: '수백 년 버팀',
    },
  });
  function crackTime(v, pattern) {
    if (pattern) return pattern === 'instant' ? CRACK.instant : CRACK.unit(pattern, CRACK.units[0]);
    let pool = 0;
    if (/[a-z]/.test(v)) pool += 26;
    if (/[A-Z]/.test(v)) pool += 26;
    if (/\d/.test(v)) pool += 10;
    if (/[ -\/:-@[-`{-~]/.test(v)) pool += 33;
    if (/[^\x00-\x7f]/.test(v)) pool += 2350;
    const secs = Math.pow(pool, [...v].length) / 2 / 1e10;
    const steps = [[60, 1], [3600, 60], [86400, 3600], [2592000, 86400], [31536000, 2592000], [3153600000, 31536000]];
    if (secs < 1) return CRACK.instant;
    for (let i = 0; i < steps.length; i++) if (secs < steps[i][0]) return CRACK.unit(Math.max(1, Math.floor(secs / steps[i][1])), CRACK.units[i]);
    return CRACK.ages;
  }
  // A digit run that reads as a date: 0412, 900412, 19900412.
  const DATE = /^(?:(?:19|20)?\d\d)?(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])$/;
  const looksLikeBirthday = (v) => (v.match(/\d+/g) || []).some((run) => [4, 6, 8].includes(run.length) && DATE.test(run));
  // 1004 is read 천사 (thousand-four), the same sound as 천사, angel; Korean texts use it so.
  // It also reads as 10/04, so the meter frets about a birthday first, then catches itself.
  const hasAngel = (v) => (v.match(/\d+/g) || []).includes('1004');
  let later;

  function say(text, mood, p, crack) {
    card.style.setProperty('--p', p);
    card.style.setProperty('--c', COLORS[mood]);
    face.dataset.mood = mood;
    pw.style.setProperty('--c', COLORS[mood] || '');
    moodWord.textContent = mood === 'none' ? '' : WORDS[TTY.lang][mood];
    crackEl.textContent = mood === 'none' ? '' : crack || '';
    // The bubble's tail points at the face wherever the bubble ends up. Worked out from the
    // numbers the CSS uses (1cqi = 1% of the card's content width), not from the bubble's box:
    // that box is still sliding and popping when this runs. (Before 2026-10-14 it measured the
    // box, and the tail landed up to a third of the bubble away from the face.)
    const w = talk.clientWidth;
    const faceX = w * p / 100;
    const left = Math.max(0, Math.min(faceX - .39 * w, .22 * w));
    bubble.style.setProperty('--tail', Math.max(10, Math.min(90, (faceX - left) / (.78 * w) * 100)) + '%');
    if (!text) { bubble.classList.add('hide'); return; }
    if (ko) {
      const el = document.createElement('font-kku');
      el.setAttribute('font', KO_FONT[mood] || 'dunggeun');
      el.setAttribute('size', '5.4cqi');
      el.setAttribute('wrap-unit', 'word');
      el.textContent = text;
      bubble.replaceChildren(el);
    } else {
      bubble.textContent = text;
    }
    bubble.classList.remove('hide');
    if (!TTY.reduce) {
      bubble.animate([{ transform: 'scale(.6) rotate(-4deg)', opacity: 0 }, { transform: 'scale(1.06) rotate(1deg)', opacity: 1, offset: .6 }, { transform: 'none', opacity: 1 }], { duration: 520, easing: 'cubic-bezier(.2,.9,.3,1.2)' });
      const [frames, ms, delay = 0] = MOVES[mood] || MOVES.meh;
      face.animate(frames.map((transform) => ({ transform })), { duration: ms, delay, easing: 'ease-out' });
    }
  }
  /* How the face reacts, by mood: [keyframes, ms, delay]. Sizes are in cqi of the card, so on a
     358 × 396 phone stage the head shake and the jump still travel 10 px or more (the face itself
     is 30 px there). The head shake waits 250 ms: started at once it rode the bar's springy slide
     and showed only +5.7 / −1.3 px around where the face came to rest. Its left swing is the larger
     one because the bar is still overshooting to the right (about 4 px) when it happens. */
  const MOVES = {
    weak: [['none', 'translateX(-5cqi) rotate(-12deg)', 'translateX(4cqi) rotate(10deg)', 'translateX(-2.5cqi) rotate(-5deg)', 'none'], 650, 250],
    meh: [['none', 'translateY(-18%) rotate(-10deg)', 'translateY(0) rotate(6deg)', 'none'], 600],
    smirk: [['none', 'translateY(-12%) rotate(16deg)', 'rotate(10deg)', 'none'], 700],
    strong: [['none', 'translateY(-6cqi) scale(1.25)', 'translateY(0) scale(.94)', 'none'], 700],
    worried: [['none', 'translateX(-1.2cqi)', 'translateX(1.2cqi)', 'translateX(-1.2cqi)', 'translateX(1.2cqi)', 'translateX(-.6cqi)', 'none'], 520],
    love: [['none', 'scale(1.18) rotate(-8deg)', 'scale(1.06) rotate(4deg)', 'none'], 800],
  };
  // Swap the button's label for the tag beat (who: 'mom' | 'dad'), or back to Sign up (null).
  const go = document.querySelector('.go');
  let calling = null;
  function callButton(who) {
    if (calling === who) return;
    calling = who;
    go.textContent = BUTTON[who || 'signup'];
    go.classList.toggle('call', !!who);
    if (who && !TTY.reduce) go.animate([{ transform: 'scale(.9)' }, { transform: 'scale(1.05)', offset: .6 }, { transform: 'none' }], { duration: 480, easing: 'cubic-bezier(.2,.9,.3,1.2)' });
  }

  /* ---- The meter watches someone choose, attempt after attempt ---- */
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  let auto = true;
  let run = 0;

  async function typeOut(text, mine) {
    while (pw.value.length) {
      if (!auto || run !== mine) return false;
      pw.value = pw.value.slice(0, -1);
      await wait(22);
    }
    for (const ch of text) {
      if (!auto || run !== mine) return false;
      pw.value += ch;
      await wait(ch === ' ' ? 140 : 60 + Math.random() * 70);
    }
    return true;
  }

  async function play() {
    const mine = ++run;
    while (auto && run === mine) {
      for (const step of SCRIPT) {
        if (!auto || run !== mine) return;
        say('', 'none', 0);
        callButton(null);
        if (!(await typeOut(step.pw, mine))) return;
        await wait(260);
        if (!auto || run !== mine) return;
        say(step.say, step.mood, step.p, step.crack);
        if (step.after) {
          await wait(1500);
          if (!auto || run !== mine) return;
          say(step.after.say, step.after.mood, step.after.p, step.after.crack);
        }
        if (step !== LAST) { await wait(2500); continue; }
        // The punchline (bubble at about 21 s in both languages, settled by 21.6 s), then the
        // tag beat 2.2 s later. On the home stage it holds past the end of the 27 s slot, so the
        // page leaves on it instead of on the next round's first password.
        await wait(2200);
        if (!auto || run !== mine) return;
        callButton(step.call);
        await wait(TTY.embedded ? 7300 : 3800);
      }
    }
  }

  /* ---- A visitor types their own ---- */
  function judge(value) {
    clearTimeout(later);
    const v = value.trim();
    if (!v) return say('', 'none', 0);
    const lower = v.toLowerCase();
    const variety = [/[a-z]/, /[A-Z]/, /\d/, /[^A-Za-z0-9]/].filter((r) => r.test(v)).length;
    let p = Math.min(100, v.length * 5 + variety * 8);
    // Typing one of the meter's own examples gets the same reaction it had.
    // The xkcd phrase is famous with or without its spaces.
    const squashed = lower.replace(/[\s_.-]/g, '');
    const known = SCRIPT.find((step) => step.pw === v || (step.mood === 'strong' && step.pw.replace(/ /g, '') === squashed));
    if (known) {
      // A two-beat step answers with its second beat at once: the visitor already knows the comic.
      const s = known.after || known;
      say(s.say, s.mood, s.p, s.crack);
      if (known.call) later = setTimeout(() => callButton(known.call), 2200);
      return;
    }
    // The other half of the xkcd strip: three days, by its own estimate.
    if (lower === 'tr0ub4dor&3') return say(OWN.troubadour, 'smirk', 46, CRACK.unit(3, CRACK.units[3]));
    if (COMMON.includes(lower)) return say(pickOne(OWN.common), 'weak', 10, crackTime(v, 'instant'));
    if (/^(.)\1+$/.test(v)) return say(OWN.repeat, 'weak', 8, crackTime(v, 'instant'));
    // Mom and dad, but not the mum in minimum or the mom in moment.
    const family = /mom|mum|mother|엄마|어머니|eomma|djaak/i.test(v) && !/moment|minimum|maximum|optimum|mumbl/i.test(v) ? 'mom'
      : /dad|아빠|아버지/i.test(v) ? 'dad' : null;
    if (family) {
      say(family === 'mom' ? pickOne(OWN.mom) : OWN.dad, 'love', Math.min(p, 38), crackTime(v, 3));
      later = setTimeout(() => callButton(family), 2200);
      return;
    }
    if (looksLikeBirthday(v)) {
      // A word and four digits on the end: a cracker tries all ten thousand endings at once.
      const crack = crackTime(v, inDictionary(v) ? 'instant' : 4);
      say(OWN.birthday, 'worried', Math.min(p, 36), crack);
      if (hasAngel(v)) later = setTimeout(() => say(OWN.angel, 'smirk', Math.min(p, 30), crack), 1500);
      return;
    }
    // Real words (and their usual dressing) go before any brute force: instantly.
    const word = inDictionary(v);
    if (word) return say(word.how === 'keys' ? OWN.dict.keys(word.hangul) : OWN.dict[word.how], 'weak', Math.min(p, 16), crackTime(v, 'instant'));
    if (/qwer|asdf|zxcv/i.test(v)) return say(OWN.row, 'meh', Math.min(p, 30), crackTime(v, 'instant'));
    if (/123|234|abc/i.test(v)) return say(OWN.count, 'meh', Math.min(p, 30), crackTime(v, 'instant'));
    if (v.length < 8) return say(OWN.short, 'weak', Math.min(p, 22), crackTime(v));
    if (v.length >= 16) return say(OWN.long, 'strong', Math.max(p, 85), crackTime(v));
    say(pickOne(OWN.meh), p > 55 ? 'smirk' : 'meh', p, crackTime(v));
  }
  let judging;
  pw.addEventListener('input', () => {
    if (auto) { auto = false; run++; }
    clearTimeout(judging);
    clearTimeout(later);
    callButton(null);
    judging = setTimeout(() => judge(pw.value), 280);
  });
  pw.addEventListener('focus', () => {
    if (!auto) return;
    auto = false; run++;
    clearTimeout(later);
    callButton(null);
    pw.value = '';
    say('', 'none', 0);
    pw.placeholder = TTY.t({ en: 'Type a password', ko: '비밀번호를 입력해 보세요' });
  });
  go.addEventListener('click', () => {
    if (auto) { auto = false; run++; }
    clearTimeout(later);
    // The bar keeps the length it had: signing up does not make a password stronger. With
    // nothing judged yet it waits in the middle.
    const cur = parseFloat(card.style.getPropertyValue('--p')) || 0;
    const line = calling ? OWN.call : OWN.signup;
    callButton(null);
    say(line, 'love', cur || 50, crackEl.textContent);
  });

  if (TTY.reduce) {
    pw.value = LAST.pw;
    say(LAST.say, LAST.mood, LAST.p, LAST.crack);
    callButton(LAST.call);
  } else {
    say('', 'none', 0);
  }

  TTY.onShow(() => { if (!TTY.reduce) setTimeout(play, 500); });
  const loaded = new Promise((r) => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
  Promise.all([loaded, document.fonts.ready]).then(TTY.ready);
})();
</script>
</body>
</html>
