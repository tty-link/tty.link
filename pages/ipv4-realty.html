<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPv4 Realty | tty.link</title>
<script src="/pages/_kit.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Permanent+Marker&family=Gothic+A1:wght@500;700;800;900&display=swap">
<script src="https://font.tty.link/lib/font-kku.js" data-fonts="gothic blueprint pilgi"></script>
<style>
  /* IPv4 addresses sold as real estate. A neighborhood realty's front window, wall-to-wall
     listing sheets, every one stickered SOLD (or worse). Next door, a gleaming IPv6 model home
     has been "now leasing" since 1995; a tumbleweed rolls past. The moving truck to IPv6 makes
     it, minus one box that only speaks IPv4. So you keep both homes: dual stack. */
  :root {
    --sky-1: #cfe3ef;
    --sky-2: #eef4f6;
    --navy: #1d3766;
    --navy-2: #142a52;
    --gold: #ffd23f;
    --frame: #aeb7be;
    --frame-lo: #7f8a93;
    --paper: #fffef8;
    --ink: #1f2731;
    --muted: #5b6672;
    --sold: #df2a1f;
    --red: #e04a2c;
    --blue: #2f6fd1;
    --green: #1f8a56;
    --orange: #e8891c;
    --gray: #77828c;
    --teal: #129b98;
    --walk: #ddd6c9;
    --asphalt: #4b5157;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    container: page / size;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, var(--sky-1), var(--sky-2) 70%);
    color: var(--ink);
    font-family: 'Barlow', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .lang-ko body { font-family: 'Gothic A1', system-ui, sans-serif; word-break: keep-all; }
  button { font: inherit; color: inherit; }

  /* ---------- the street ---------- */
  .scene {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: 1.7fr 1fr;
    grid-template-rows: var(--sky) 1fr var(--road) var(--bar);
    padding: 0 var(--pad);
    --pad: clamp(8px, 2.6cqw, 30px);
    --sky: clamp(26px, 8cqh, 72px);
    --road: clamp(54px, 11.5cqh, 100px);
    --bar: clamp(48px, 8.5cqh, 66px);
  }
  .skyline { grid-area: 1 / 1 / 3 / 3; align-self: end; justify-self: end; width: 72%; height: 86%; opacity: .55; pointer-events: none; }
  .skyline svg { display: block; width: 100%; height: 100%; }

  /* ---------- IPv4 Realty ---------- */
  .v4 {
    grid-area: 2 / 1;
    align-self: end;
    height: 90%;
    margin-right: clamp(6px, 1.6cqw, 18px);
    display: flex;
    flex-direction: column;
    container: v4 / size;
    position: relative;
    z-index: 1;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 1px, transparent 1px 14px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 1px, transparent 1px 28px),
      #e9dfca;
    box-shadow: 0 0 0 1px rgba(0,0,0,.08);
  }
  .sign {
    flex: none;
    height: clamp(36px, 12.5cqh, 88px);
    margin: 0 -1.2cqi;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .35em;
    padding: 0 3cqi;
    background: linear-gradient(180deg, #24427a, var(--navy-2));
    border-bottom: clamp(3px, .9cqh, 6px) solid var(--gold);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.12), 0 3px 8px rgba(0,0,0,.25);
    color: #fff;
    font: 800 clamp(20px, 7.6cqh, 54px)/1 'Barlow Condensed', sans-serif;
    letter-spacing: .01em;
    white-space: nowrap;
  }
  .sign-v { color: var(--gold); }
  .sign-sub { align-self: center; margin-left: .5em; font: 600 clamp(11px, 2.4cqh, 16px)/1.2 'Barlow', sans-serif; color: #c9d6ee; letter-spacing: .02em; white-space: nowrap; }
  .lang-ko .sign-sub { font-family: 'Gothic A1', sans-serif; font-weight: 700; }
  .k-sign { color: #fff; --fy-element-width: .12em; }
  .strip {
    flex: none;
    height: clamp(17px, 4.6cqh, 30px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .6em;
    padding: 0 2cqi;
    background: #f7f1e3;
    border-bottom: 1px solid rgba(0,0,0,.12);
    color: var(--navy);
    font: 700 clamp(11px, 2.5cqh, 15px)/1 'Barlow', sans-serif;
    letter-spacing: .04em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
  }
  .lang-ko .strip { font-family: 'Gothic A1', sans-serif; text-transform: none; letter-spacing: .02em; }
  .window {
    flex: 1;
    position: relative;
    margin: clamp(6px, 1.8cqh, 16px) 2.4cqi 0;
    border: clamp(4px, 1.1cqi, 10px) solid var(--frame);
    border-bottom-width: clamp(5px, 1.4cqi, 12px);
    background:
      linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.18)),
      radial-gradient(80% 60% at 30% 70%, #3f5560, #24333b 70%);
    box-shadow: inset 0 0 0 1px var(--frame-lo), inset 0 6px 18px rgba(0,0,0,.45);
    padding: clamp(6px, 2.4cqi, 18px);
  }
  .glare {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(115deg, transparent 0 22%, rgba(255,255,255,.12) 22% 30%, transparent 30% 58%, rgba(255,255,255,.08) 58% 61%, transparent 61%);
    z-index: 3;
  }
  .sheets {
    position: relative;
    z-index: 2;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: clamp(5px, 2.2cqi, 18px);
  }
  .sill { flex: none; height: clamp(6px, 2.2cqh, 14px); margin: 0 1.4cqi; background: linear-gradient(#cfc8ba, #b4ad9f); }

  .sheet {
    position: relative;
    container: sheet / size;
    padding: 0;
    border: 0;
    background: var(--paper);
    box-shadow: 0 2px 4px rgba(0,0,0,.35);
    text-align: left;
    cursor: pointer;
    min-width: 0;
    min-height: 0;
    rotate: var(--tilt, 0deg);
    transition: transform .25s, box-shadow .25s;
  }
  /* The sheet is its own container, so its padding would be measured against the window;
     the inner box carries the layout instead. */
  .si {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 3cqh;
    padding: 7cqi 7cqi 6cqi;
  }
  .pic {
    position: relative;
    flex: 1 1 0;
    align-self: stretch;
    min-height: 8px;
    border: 1px solid #d6cfbf;
    background:
      linear-gradient(90deg, transparent 38%, #cfc7b6 38% 39%, transparent 39%),
      linear-gradient(180deg, transparent 55%, #cfc7b6 55% 56%, transparent 56%),
      linear-gradient(90deg, transparent 70%, #cfc7b6 70% 71%, transparent 71%) 0 0 / 100% 55% no-repeat,
      #f3efe4;
  }
  .sheet::before, .sheet::after {
    content: "";
    position: absolute;
    top: -2.2cqh;
    width: 22cqi;
    height: 7cqh;
    background: rgba(255, 255, 240, .55);
    box-shadow: 0 0 0 1px rgba(0,0,0,.04);
  }
  .sheet::before { left: -4cqi; rotate: -32deg; }
  .sheet::after { right: -4cqi; rotate: 32deg; }
  .sheet:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .sheet.hi { transform: scale(1.1); z-index: 4; box-shadow: 0 10px 24px rgba(0,0,0,.45); }
  .tag {
    flex: none;
    padding: .2em .55em .22em;
    border-radius: 3px;
    background: var(--tone);
    color: #fff;
    font: 700 clamp(11px, 8.6cqi, 15px)/1 'Barlow Condensed', sans-serif;
    letter-spacing: .05em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .lang-ko .tag { font: 800 clamp(11px, 8.4cqi, 15px)/1 'Gothic A1', sans-serif; letter-spacing: 0; }
  .k-hand { color: var(--sold); }
  .tag.hand { padding: 0; background: none; color: var(--sold); font: 400 clamp(14px, 13cqi, 22px)/1 'Permanent Marker', cursive; rotate: -6deg; }
  .addr { flex: none; font: 700 clamp(12px, 11.5cqi, 22px)/1 'Barlow Condensed', sans-serif; letter-spacing: .02em; color: var(--ink); white-space: nowrap; }
  .big { font: 800 clamp(12px, 9cqi, 19px)/1.15 'Barlow', sans-serif; color: var(--ink); }
  .lang-ko .big { font-family: 'Gothic A1', sans-serif; font-size: clamp(12px, 8.4cqi, 18px); letter-spacing: -.02em; }
  .hook {
    margin-top: auto;
    font: 600 clamp(11px, 8cqi, 15px)/1.25 'Barlow', sans-serif;
    color: #3b4651;
  }
  .lang-ko .hook { font-family: 'Gothic A1', sans-serif; font-weight: 700; }
  /* The marker runs under every line of the hook, not just the last one. */
  .hl { -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .sheet.hi .hl { background: linear-gradient(transparent 52%, rgba(255, 210, 63, .85) 52%); }
  .stk {
    position: absolute;
    left: 50%;
    top: 50%;
    translate: -50% -50%;
    rotate: var(--r, -9deg);
    z-index: 2;
    padding: .28em .6em .3em;
    border: 2px solid #fff;
    border-radius: 3px;
    outline: 1.5px solid var(--sold);
    background: var(--sold);
    color: #fff;
    font: 800 clamp(12px, min(12.5cqi, 13cqh), 26px)/1 'Barlow Condensed', sans-serif;
    letter-spacing: .06em;
    white-space: nowrap;
    box-shadow: 0 2px 5px rgba(0,0,0,.35);
    opacity: 0;
    pointer-events: none;
  }
  .lang-ko .stk { font: 900 clamp(12px, min(11cqi, 11.5cqh), 22px)/1 'Gothic A1', sans-serif; letter-spacing: .02em; }
  .stk.on { opacity: 1; }
  .stk.calm { background: #6d7882; outline-color: #6d7882; }

  /* ---------- IPv6 New Town model home ---------- */
  .v6 {
    grid-area: 1 / 2 / 3 / 3;
    align-self: end;
    height: calc(100% - 4px);
    position: relative;
    z-index: 1;
    margin-left: clamp(4px, 1cqw, 12px);
    container: v6 / size;
  }
  .v6-face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: clamp(4px, 1.5cqh, 12px);
    padding: clamp(6px, 2cqh, 16px) 5cqi 0;
    border: 0;
    border-top: clamp(6px, 2cqh, 14px) solid #dfe6ec;
    background:
      linear-gradient(90deg, rgba(255,255,255,.0) 0 47%, rgba(255,255,255,.65) 47% 48%, transparent 48%),
      repeating-linear-gradient(90deg, transparent 0 23.5%, rgba(255,255,255,.55) 23.5% 24.5%),
      repeating-linear-gradient(180deg, transparent 0 8.5%, rgba(255,255,255,.45) 8.5% 9%),
      linear-gradient(160deg, #e8f4fa, #bcd7e6 45%, #d9ecf4 70%, #a9c9da);
    box-shadow: inset 0 0 0 clamp(3px, 1.4cqi, 8px) #f6f8fa, 0 0 0 1px rgba(0,0,0,.08);
    text-align: center;
    cursor: pointer;
    overflow: hidden;
  }
  .v6-face:focus-visible { outline: 3px solid var(--gold); outline-offset: -6px; }
  .glint {
    position: absolute;
    inset: -10% -60%;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.85) 48%, rgba(255,255,255,.2) 52%, transparent 58%);
    transform: translateX(-80%);
    pointer-events: none;
    z-index: 5;
  }
  .bp {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .9cqh;
    padding: 1.4cqh 2cqi;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.12) 0 1px, transparent 1px 9px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.12) 0 1px, transparent 1px 9px),
      #134383;
    border: 2px solid #eaf2fb;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
    color: #fff;
  }
  .bp-v { font: 800 clamp(18px, 6.2cqh, 46px)/1 'Barlow Condensed', sans-serif; letter-spacing: .03em; }
  .bp-en { font: 700 clamp(12px, 3.2cqh, 22px)/1 'Barlow Condensed', sans-serif; letter-spacing: .16em; }
  .mh { flex: none; font: 700 clamp(11px, 2.4cqh, 15px)/1 'Barlow', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--navy); }
  .lang-ko .mh { font-family: 'Gothic A1', sans-serif; letter-spacing: .3em; }
  .ban {
    flex: none;
    position: relative;
    margin: 0 -1cqi;
    padding: 1.2cqh 2cqi 1.1cqh;
    background: var(--red);
    color: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .7cqh;
  }
  .ban::before, .ban::after { content: ""; position: absolute; top: 50%; width: 1.6cqi; height: 1.6cqi; min-width: 4px; min-height: 4px; border-radius: 50%; background: #fff; translate: 0 -50%; }
  .ban::before { left: 1.2cqi; }
  .ban::after { right: 1.2cqi; }
  .ban-t { font: 800 clamp(15px, 4.4cqh, 34px)/1 'Barlow Condensed', sans-serif; letter-spacing: .08em; }
  /* Thin strokes vanish at 1x: at least 2 px for the banner's element strokes. */
  .k-ban { color: #fff; --fy-element-width: max(2px, .12em); }
  /* blueprint draws hollow outlines (0.018em, 20% fill) that read only at 2x; a firmer line
     (at least 1.2 px), a bolder face and a half-filled inside keep the drawing look at 1x. */
  .k-bp { --fy-stroke: max(1.2px, .045em); --fy-weight: 700; }
  .k-bp [part~="jamo"] { -webkit-text-fill-color: rgb(242 248 255 / .45); }
  .k-bp [part~="jungseong"] { -webkit-text-fill-color: rgb(125 211 252 / .45); }
  .k-bp [part~="jongseong"] { -webkit-text-fill-color: rgb(255 214 102 / .45); }
  .ban-sub { font: 700 clamp(11px, 2.3cqh, 15px)/1.15 'Barlow', sans-serif; color: #ffe7a6; }
  .lang-ko .ban-sub { font-family: 'Gothic A1', sans-serif; }
  .units { flex: none; display: flex; flex-direction: column; align-items: center; gap: .5cqh; color: var(--navy-2); }
  .units-n { font: 900 clamp(14px, 4.3cqh, 32px)/1.05 'Barlow Condensed', sans-serif; letter-spacing: .01em; }
  .lang-ko .units-n { font-family: 'Gothic A1', sans-serif; letter-spacing: -.02em; }
  .units-s { font: 600 clamp(11px, 2.2cqh, 15px)/1 'IBM Plex Mono', monospace; color: #2c4a6e; }
  .gauge { flex: none; display: flex; flex-direction: column; gap: .6cqh; padding: 1.1cqh 3cqi; background: rgba(255,255,255,.82); border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.15); transition: transform .25s, box-shadow .25s; }
  .g-l { font: 800 clamp(11px, 2.6cqh, 17px)/1.1 'Barlow', sans-serif; color: var(--navy-2); }
  .lang-ko .g-l { font-family: 'Gothic A1', sans-serif; }
  .g-short { display: none; }
  .g-bar { height: clamp(6px, 1.3cqh, 10px); border-radius: 99px; background: #d5dde4; overflow: hidden; }
  .g-bar i { display: block; width: var(--p); height: 100%; background: var(--teal); border-radius: inherit; }
  .g-s { font: 600 clamp(11px, 1.9cqh, 13px)/1.1 'Barlow', sans-serif; color: var(--muted); }
  .lang-ko .g-s { font-family: 'Gothic A1', sans-serif; font-weight: 500; }
  .gauge.hi, .ban.hi { transform: scale(1.08); box-shadow: 0 8px 20px rgba(0,0,0,.3); z-index: 2; }
  .entry {
    flex: 1;
    min-height: 0;
    position: relative;
    margin: 0 4cqi;
    border: clamp(3px, 1.2cqi, 7px) solid #f4f6f8;
    border-bottom: 0;
    background: linear-gradient(180deg, #f3ead9, #e6d6bd);
    overflow: hidden;
  }
  .entry svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }
  .entry::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, transparent 49%, #f4f6f8 49% 51%, transparent 51%),
      linear-gradient(115deg, transparent 20%, rgba(255,255,255,.35) 20% 30%, transparent 30% 60%, rgba(255,255,255,.2) 60% 64%, transparent 64%);
  }
  /* The tag beat: a second after the banner, the model home's own glass gets a sticker. */
  .half {
    position: absolute;
    left: 50%;
    top: 42%;
    z-index: 2;
    width: max-content;
    max-width: 94%;
    translate: -50% -50%;
    rotate: -7deg;
    text-wrap: balance;
    padding: .28em .55em .3em;
    border: 2px solid #fff;
    border-radius: 3px;
    outline: 1.5px solid var(--sold);
    background: var(--sold);
    color: #fff;
    font: 800 clamp(12px, 8.6cqi, 22px)/1.05 'Barlow Condensed', sans-serif;
    letter-spacing: .05em;
    text-align: center;
    box-shadow: 0 2px 5px rgba(0,0,0,.35);
    opacity: 0;
  }
  .lang-ko .half { font: 900 clamp(12px, 8.6cqi, 21px)/1.05 'Gothic A1', sans-serif; letter-spacing: .02em; white-space: nowrap; }
  .half.on { opacity: 1; }
  .flag { position: absolute; bottom: 0; width: clamp(16px, 9cqi, 34px); height: 40cqh; z-index: 2; pointer-events: none; }
  .flag.l { left: -2cqi; }
  .flag.r { right: -2cqi; }
  .flag svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .flag .cloth { transform-origin: 3px 6px; animation: wave 1.6s ease-in-out infinite alternate; }
  .flag.r .cloth { animation-delay: -.8s; }
  @keyframes wave { from { transform: skewY(-6deg) scaleX(.94); } to { transform: skewY(5deg) scaleX(1); } }

  /* ---------- road, truck, tumbleweed ---------- */
  .road {
    grid-area: 3 / 1 / 4 / 3;
    position: relative;
    margin: 0 calc(-1 * var(--pad));
    container: road / size;
    /* The truck waits off to the left and the tumbleweed leaves to the right: clip sideways
       only, so a hopping box and the speech bubble can still rise above the road. */
    overflow-x: clip;
    background:
      linear-gradient(180deg, var(--walk) 0 34%, #b9b1a2 34% 38%, var(--asphalt) 38% 100%);
    z-index: 2;
  }
  .road::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 0; height: 34%;
    background: repeating-linear-gradient(90deg, transparent 0 46px, rgba(0,0,0,.08) 46px 47px);
  }
  .road::after {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 74%; height: 3px;
    background: repeating-linear-gradient(90deg, #f1e7b4 0 28px, transparent 28px 52px);
    opacity: .8;
  }
  .truck {
    position: absolute;
    left: -30%;
    bottom: 9%;
    height: 76cqh;
    aspect-ratio: 120 / 64;
    z-index: 4;
  }
  .truck-body { position: absolute; inset: 0; }
  .truck svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .hz { opacity: 0; }
  .truck.haz .hz { animation: blink .5s steps(1) infinite; }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
  .cargo { position: absolute; left: 7%; bottom: 72%; width: 23%; aspect-ratio: 1; }
  .cargo svg, .item svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .item { position: absolute; bottom: 62%; width: clamp(24px, 50cqh, 52px); aspect-ratio: 1; z-index: 5; translate: -50% 0; }
  .item-in { width: 100%; height: 100%; transform-origin: 50% 100%; }
  .weed { position: absolute; left: 110%; bottom: 46%; width: clamp(24px, 46cqh, 52px); aspect-ratio: 1; z-index: 3; }
  .weed-b, .weed-s { width: 100%; height: 100%; }
  .weed svg { display: block; width: 100%; height: 100%; }
  .bubble {
    position: absolute;
    bottom: calc(62cqh - 4px);
    left: 1%;
    z-index: 7;
    max-width: min(62%, 380px);
    transform-origin: 0 100%;
    padding: .4em .75em .45em;
    border: 2px solid var(--ink);
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,.25);
    font: 600 clamp(12px, 16cqh, 16px)/1.3 'Barlow', sans-serif;
    opacity: 0;
    pointer-events: none;
  }
  .lang-ko .bubble { font-family: 'Gothic A1', sans-serif; font-weight: 700; }
  .bubble b { display: block; margin-bottom: .1em; font-size: max(10px, .82em); color: var(--muted); }
  /* The tail points left, at the thing that would not move. */
  .bubble::after {
    content: "";
    position: absolute;
    left: -8px;
    bottom: 10px;
    width: 12px;
    height: 12px;
    background: #fff;
    border-left: 2px solid var(--ink);
    border-bottom: 2px solid var(--ink);
    rotate: 45deg;
  }
  .bubble.on { opacity: 1; }
  /* 3.6 s: a letter leaves 127.0.0.1, gets as far as the doorstep and comes straight back. */
  .env { position: absolute; left: 0; top: 0; z-index: 8; width: clamp(26px, 5cqw, 36px); aspect-ratio: 4 / 3; pointer-events: none; opacity: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
  .env svg { display: block; width: 100%; height: 100%; overflow: visible; }

  /* ---------- the punchline banner ---------- */
  .punch {
    grid-area: 1 / 1 / 2 / 2;
    align-self: start;
    position: relative;
    z-index: 9;
    margin: clamp(5px, 1.3cqh, 12px) clamp(6px, 1.6cqw, 18px) 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 1.6cqw, 18px);
    padding: clamp(5px, 1.1cqh, 12px) clamp(12px, 2.6cqw, 30px);
    background: #d42a1f;
    border: 2px solid rgba(255,255,255,.5);
    box-shadow: 0 8px 20px rgba(0,0,0,.3);
    color: #fff;
    transform: translateY(-160%);
    visibility: hidden;
  }
  .punch::before, .punch::after { content: ""; position: absolute; top: -60px; width: 2px; height: 62px; background: #6b5a44; }
  .punch::before { left: 6%; rotate: 18deg; }
  .punch::after { right: 6%; rotate: -18deg; }
  .punch.on { transform: none; visibility: visible; }
  .p-mark {
    flex: none;
    display: grid;
    place-items: center;
    width: clamp(30px, 6.4cqh, 56px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: #fff;
    color: #d42a1f;
    font: 900 clamp(16px, 3.6cqh, 30px)/1 'Gothic A1', sans-serif;
  }
  .p-txt { display: flex; flex-direction: column; align-items: flex-start; gap: clamp(2px, .6cqh, 6px); min-width: 0; }
  .p-big { font: 400 clamp(17px, min(4.6cqh, 3cqw), 40px)/1.05 'Permanent Marker', cursive; letter-spacing: .01em; }
  .k-punch { color: #fff; --fy-element-width: .13em; }
  .p-sub { font: 600 clamp(11px, 1.9cqh, 16px)/1.25 'Barlow', sans-serif; color: #ffe1b0; }
  .lang-ko .p-sub { font-family: 'Gothic A1', sans-serif; font-weight: 700; }

  /* ---------- bottom bar ---------- */
  .bar {
    grid-area: 4 / 1 / 5 / 3;
    display: flex;
    align-items: center;
    gap: clamp(8px, 1.6cqw, 18px);
    min-width: 0;
    z-index: 3;
  }
  html:not(.embedded) .bar { padding-right: 230px; }
  .move {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: .45em;
    min-height: clamp(34px, 5.4cqh, 44px);
    padding: .3em .95em .3em .7em;
    border: 0;
    border-radius: 999px;
    background: var(--gold);
    color: var(--navy-2);
    font: 800 clamp(13px, 2.1cqh, 17px)/1 'Barlow', sans-serif;
    box-shadow: 0 0 0 1.5px rgba(20,42,82,.35), 0 3px 0 #c9a21e, 0 5px 10px rgba(0,0,0,.18);
    cursor: pointer;
    white-space: nowrap;
    transition: transform .12s, box-shadow .12s;
  }
  .lang-ko .move { font-family: 'Gothic A1', sans-serif; }
  .move svg { width: 1.6em; height: 1em; flex: none; }
  .move:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
  .move.press, .move:active { transform: translateY(3px); box-shadow: 0 0 0 1.5px rgba(20,42,82,.35), 0 0 0 #c9a21e, 0 2px 4px rgba(0,0,0,.18); }
  .hint { min-width: 0; font: 600 clamp(11px, 1.8cqh, 15px)/1.3 'Barlow', sans-serif; color: #3d4b58; }
  .lang-ko .hint { font-family: 'Gothic A1', sans-serif; font-weight: 600; }

  /* ---------- listing card ---------- */
  .scrim { position: absolute; inset: 0; z-index: 20; background: rgba(15, 25, 38, .5); }
  .card {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 21;
    translate: -50% -50%;
    width: min(94cqw, 560px);
    max-height: 92cqh;
    overflow: auto;
    overscroll-behavior: contain;
    background: var(--paper);
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
    border-top: 6px solid var(--tone, var(--navy));
    font-size: clamp(12px, 2cqh, 15px);
  }
  .scrim[hidden], .card[hidden] { display: none; }
  .card-head { display: flex; align-items: center; gap: .6em; padding: .7em 1em .5em; border-bottom: 1px dashed #c9c3b5; }
  .card-kind { padding: .2em .55em; border-radius: 3px; background: var(--tone, var(--navy)); color: #fff; font: 800 .86em/1.1 'Barlow Condensed', sans-serif; letter-spacing: .06em; text-transform: uppercase; }
  .lang-ko .card-kind { font-family: 'Gothic A1', sans-serif; letter-spacing: 0; }
  .card-no { font: 600 .86em/1 'IBM Plex Mono', monospace; color: var(--muted); }
  .card-x { margin-left: auto; display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 50%; background: #ece7db; font: 700 20px/1 'Barlow', sans-serif; cursor: pointer; }
  .card-x:focus-visible { outline: 3px solid var(--gold); }
  .card-addr { padding: .55em 1rem 0; font: 600 clamp(17px, 3.2cqh, 26px)/1.15 'IBM Plex Mono', monospace; overflow-wrap: anywhere; }
  .card-name { padding: .2em 1rem .6em; font: 800 1.08em/1.25 'Barlow', sans-serif; color: var(--navy-2); }
  .lang-ko .card-name { font-family: 'Gothic A1', sans-serif; }
  .card-rows { display: grid; grid-template-columns: auto 1fr; margin: 0 1rem; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
  .card-rows dt, .card-rows dd { padding: .42em .6em; border-bottom: 1px solid #e3ddcf; line-height: 1.35; }
  .card-rows dt { background: #f1ece0; font-weight: 700; color: #3d4652; white-space: nowrap; }
  .card-rows dd { margin: 0; overflow-wrap: anywhere; }
  .card-rows .sold { color: var(--sold); font-weight: 800; }
  .card-notes { margin: .7em 1rem 0; padding: 0; list-style: none; display: grid; gap: .45em; }
  .card-notes li { position: relative; padding-left: 1.3em; line-height: 1.45; }
  .card-notes li::before { content: "※"; position: absolute; left: 0; color: var(--sold); }
  .card-agent { display: flex; align-items: center; flex-wrap: wrap; gap: .3em .8em; margin: .8em 1rem 1rem; padding: .6em .8em; background: #f6f1e4; border-left: 4px solid var(--tone, var(--navy)); }
  .card-agent-k { font-weight: 700; font-size: .86em; color: var(--muted); }
  .card-agent-v { font: 400 1.25em/1.2 'Permanent Marker', cursive; color: #273a63; }
  .k-agent { color: #273a63; }

  /* ---------- narrow screens ---------- */
  @container page (max-width: 620px) {
    .scene { grid-template-columns: 2.15fr 1fr; }
    .sheets { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); }
    .si { padding: 5cqi 6cqi 4cqi; gap: 2cqh; }
    .tag, .big { display: none; }
    .sign-sub, .strip-x { display: none; }
    html:not(.embedded) .bar { padding-right: 88px; }
    /* Keep the card clear of the standalone "?" and ":)" buttons. */
    html:not(.embedded) .card { top: calc(50% - 22px); max-height: calc(92cqh - 44px); }
    .p-big { font-size: clamp(16px, 4.4cqw, 22px); }
    /* A pointed-out listing comes properly forward on a phone, growing inward from its edge. */
    .sheet.hi { transform: scale(1.5); }
    .sheet:nth-child(odd) { transform-origin: 0 50%; }
    .sheet:nth-child(even) { transform-origin: 100% 50%; }
    .sheet:nth-child(1) { transform-origin: 0 0; }
    .sheet:nth-child(2) { transform-origin: 100% 0; }
    .sheet:nth-child(5) { transform-origin: 0 100%; }
    .sheet:nth-child(6) { transform-origin: 100% 100%; }
  }
  /* The "축" disc is half the Korean punchline: smaller on a phone, never gone. */
  @container page (max-width: 420px) {
    .p-mark { width: 24px; font-size: 14px; }
  }
  @container page (max-height: 600px) {
    .sign-sub { display: none; }
  }
  @container sheet (max-height: 175px) {
    .big { display: none; }
  }
  @container sheet (max-height: 140px) {
    .tag { display: none; }
  }
  @container v6 (max-width: 170px) {
    .units-s, .g-s, .ban::before, .ban::after { display: none; }
    .g-long { display: none; }
    .g-short { display: inline; }
    /* A phone's model home is ~90 px wide: a bigger lift would push the ends past its frame. */
    .gauge.hi, .ban.hi { transform: scale(1.03); }
  }
  /* Short phone stages (the home page's 358×396): the tagline strip gives its height to the
     listing sheets. On a short sheet the sticker is smaller and flatter so it sits on the photo
     between the address and the hook, and it peels back while that listing is pointed out. */
  @container page (max-height: 440px) {
    .strip { display: none; }
    .window { margin-top: 4px; padding: 4px; border-bottom-width: 4px; }
    .sill { height: 4px; }
  }
  @container sheet (max-height: 80px) {
    .si { padding: 3cqi 6cqi 3cqi; gap: .5cqh; }
    .hook { line-height: 1.1; }
    .stk, .lang-ko .stk {
      padding: .04em .4em .06em;
      border-width: 1px;
      outline-width: 1px;
      font-size: 10px;
      rotate: calc(var(--r, -9deg) * .1);
      transition: opacity .3s, transform .3s;
    }
    .sheet.hi .stk { opacity: .08; transform: translate(12%, -45%) rotate(-12deg); }
  }
  @container sheet (max-height: 80px) and (max-width: 92px) {
    .hook { font-size: 10.5px; letter-spacing: -.01em; }
  }

  @media (prefers-reduced-motion: reduce) {
    .flag .cloth { animation: none; }
    .truck.haz .hz { animation: none; opacity: 1; }
    .sheet, .gauge, .ban, .move, .stk, .lang-ko .stk { transition: none; }
    .env { display: none; }
  }
</style>
</head>
<body>
<main class="scene" aria-labelledby="page-title">
  <div class="skyline" aria-hidden="true">
    <svg viewBox="0 0 400 300" preserveAspectRatio="xMaxYMax meet">
      <g fill="#b7c9d6">
        <rect x="150" y="70" width="44" height="230"/><rect x="200" y="40" width="50" height="260"/>
        <rect x="258" y="90" width="40" height="210"/><rect x="305" y="55" width="48" height="245"/><rect x="358" y="100" width="42" height="200"/>
      </g>
      <g fill="#c9d8e2">
        <rect x="156" y="78" width="32" height="2"/><rect x="206" y="48" width="38" height="2"/><rect x="311" y="63" width="36" height="2"/>
      </g>

  <section class="v4" aria-label="IPv4">

    <div class="window">
      <div class="sheets" id="sheets"></div>
      <div class="glare" aria-hidden="true"></div>

    <div class="sill" aria-hidden="true"></div>
  </section>

  <section class="v6" aria-label="IPv6">
    <button type="button" class="v6-face" id="v6" data-id="v6">
      <span class="bp">
        <span class="bp-v">IPv6</span>
        <span class="bp-en" data-lang="en">NEW TOWN</span>
        <font-kku data-lang="ko" font="blueprint" size="clamp(20px, min(6cqh, 22cqi), 44px)" class="k-bp">신도시</font-kku>
      </span>
      <span class="mh" data-lang="en">Model home</span>
      <span class="mh" data-lang="ko">견본주택</span>
      <span class="ban" id="ban">
        <span class="ban-t" data-lang="en">NOW LEASING</span>
        <font-kku data-lang="ko" font="gothic" size="clamp(14px, min(4cqh, 14.4cqi), 30px)" class="k-ban">입주자 모집 중</font-kku>
        <span class="ban-sub" data-lang="en">since 1995 · year <b class="yrs">31</b></span>
        <span class="ban-sub" data-lang="ko">1995년부터 · <b class="yrs">31</b>년째</span>
      </span>
      <span class="units">
        <span class="units-n" data-lang="en">340 undecillion homes</span>
        <span class="units-n" data-lang="ko">340간 세대</span>
        <span class="units-s">2¹²⁸ ≈ 3.4×10³⁸</span>
      </span>
      <span class="gauge" id="gauge">
        <span class="g-l" data-lang="en">Moved in: <span class="g-long">about </span><span class="g-short">~</span>48%</span>
        <span class="g-l" data-lang="ko"><span class="g-long">이사 온 사람</span><span class="g-short">전입</span> 약 48%</span>
        <span class="g-bar"><i style="--p: 48%"></i></span>
        <span class="g-s" data-lang="en">Google, Oct 2026</span>
        <span class="g-s" data-lang="ko">구글 측정 · 2026년 10월</span>
      </span>
      <span class="entry" aria-hidden="true">
        <svg viewBox="0 0 100 80" preserveAspectRatio="xMidYMax meet">
          <rect x="0" y="62" width="100" height="18" fill="#d9c7a6"/>
          <path d="M70 62 v-24 h16 v24 M66 38 h24 l-4 -10 h-16 z" fill="#f6e7c4" stroke="#b49a6c" stroke-width="1"/>
          <path d="M12 62 v-12 h40 v12 M14 50 v-6 h36 v6" fill="#9fb7c4" stroke="#6f8796" stroke-width="1"/>
          <rect x="20" y="20" width="20" height="14" fill="#fff" stroke="#c8b48f" stroke-width="1"/>
          <path d="M23 31 l5 -6 4 4 3 -3 4 5 z" fill="#9cc7a0"/>
        </svg>
        <span class="half" id="half"><span data-lang="en">HALF MOVED IN</span><span data-lang="ko">반만 입주</span></span>
      </span>
      <span class="glint" aria-hidden="true"></span>
    </button>
    <div class="flag l" aria-hidden="true"><svg viewBox="0 0 30 200" preserveAspectRatio="none"><rect x="2" y="0" width="2" height="200" fill="#8a96a0"/><path class="cloth" d="M4 6 H28 V70 L16 62 L4 70 Z" fill="#e04a2c"/></svg></div>
    <div class="flag r" aria-hidden="true"><svg viewBox="0 0 30 200" preserveAspectRatio="none"><rect x="26" y="0" width="2" height="200" fill="#8a96a0"/><path class="cloth" d="M26 6 H2 V70 L14 62 L26 70 Z" fill="#ffd23f"/></svg></div>
  </section>

  <div class="road" id="road">
    <div class="weed" aria-hidden="true"><div class="weed-b"><div class="weed-s">
      <svg viewBox="0 0 40 40"><g fill="none" stroke="#9a6b3a" stroke-width="1.6" stroke-linecap="round">
        <circle cx="20" cy="20" r="16"/><ellipse cx="20" cy="20" rx="16" ry="8" transform="rotate(30 20 20)"/>
        <ellipse cx="20" cy="20" rx="15" ry="9" transform="rotate(-40 20 20)"/><ellipse cx="20" cy="20" rx="8" ry="15" transform="rotate(12 20 20)"/>
        <path d="M6 14 q8 4 14 -2 t14 4 M8 28 q6 -6 12 0 t12 -2 M14 6 q2 10 -2 16 M26 34 q-4 -8 2 -14"/>
      </g></svg>
    </div></div></div>
    <div class="truck" id="truck" aria-hidden="true">
      <div class="truck-body">
        <svg viewBox="0 0 120 64">
          <ellipse cx="60" cy="61" rx="56" ry="3" fill="rgba(0,0,0,.28)"/>

          <path d="M3 40 V30 M77 40 V30 M3 31 H77" stroke="#97a1aa" stroke-width="2" fill="none"/>
          <rect x="7" y="18" width="24" height="22" fill="#c99a5b" stroke="#8a6232"/>
          <path d="M7 24 H31 M19 18 V24" stroke="#e8d2a8" stroke-width="2"/>
          <rect x="32" y="23" width="22" height="17" fill="#d1a565" stroke="#8a6232"/>
          <path d="M32 28 H54" stroke="#e8d2a8" stroke-width="2"/>
          <rect x="55" y="27" width="20" height="13" fill="#c99a5b" stroke="#8a6232"/>
          <path d="M79 49 V20 q0 -3 3 -3 h19 q5 0 8 5 l6 12 q2 3 2 7 v8 z" fill="#2f6fd1" stroke="#1d4a91"/>
          <path d="M84 22 h15 q3 0 5 3.6 l5 10.4 h-25 z" fill="#d6ebf8"/>
          <rect x="88" y="40" width="7" height="1.6" fill="#1d4a91"/>
          <rect x="103" y="48" width="15" height="4" rx="1" fill="#e6e9ec"/>
          <rect x="111" y="40" width="5" height="4" rx="1" fill="#fff4c2"/>
          <rect class="hz" x="113" y="45" width="4" height="3" fill="#ffad1f"/>
          <rect class="hz" x="1" y="42" width="3" height="6" fill="#ff7a1a"/>
          <circle cx="23" cy="52" r="8" fill="#23272b"/><circle cx="23" cy="52" r="3.2" fill="#aeb6bd"/>
          <circle cx="97" cy="52" r="8" fill="#23272b"/><circle cx="97" cy="52" r="3.2" fill="#aeb6bd"/>
        </svg>
        <div class="cargo" id="cargo"></div>
      </div>
    </div>
    <p class="bubble" id="bubble" role="status"></p>
  </div>

  <div class="bar">
    <button type="button" class="move" id="move">
      <svg viewBox="0 0 26 16" aria-hidden="true"><path d="M1 3 h14 v9 H1 z" fill="#c99a5b" stroke="#142a52" stroke-width="1.2"/><path d="M15 6 h5 l4 4 v2 h-9 z" fill="#2f6fd1" stroke="#142a52" stroke-width="1.2"/><circle cx="6" cy="13" r="2.2" fill="#142a52"/><circle cx="20" cy="13" r="2.2" fill="#142a52"/></svg>
      <span data-lang="en">Move to IPv6</span>
      <span data-lang="ko">IPv6로 이사하기</span>

      <span data-lang="en">Tap a listing or the model home for details.</span>

<script>
(() => {
  const ko = TTY.lang === 'ko';
  const $ = (s) => document.querySelector(s);
  const reduce = TTY.reduce;

  // ---------- facts (checked 2026-10-13) ----------
  // Years of "now leasing": RFC 1883, the first IPv6 specification, is dated December 1995.
  const now = new Date();
  const leasingYear = now.getFullYear() - 1995 + (now.getMonth() >= 11 ? 1 : 0);
  document.querySelectorAll('.yrs').forEach((el) => { el.textContent = leasingYear; });

  const TONE = { red: 'var(--sold)', blue: 'var(--blue)', green: 'var(--green)', orange: 'var(--orange)', gray: 'var(--gray)', teal: 'var(--teal)' };

  const SHEETS = [
    { id: 'all', tone: 'red', tilt: -1.2, r: -9,
      en: { tag: 'For sale', addr: '0.0.0.0/0', big: '4.3 billion homes', hook: 'Fewer homes than people', stk: 'SOLD OUT' },
      ko: { tag: '분양', addr: '0.0.0.0/0', big: '43억 세대 대단지', hook: '사람보다 집이 적음', stk: '분양 완료' } },
    { id: 'loop', tone: 'blue', tilt: 1, r: 8,
      en: { tag: 'Owner-occupied', addr: '127.0.0.1', big: '16,777,216 rooms', hook: "There's no place like 127.0.0.1", stk: 'NOT FOR SALE' },
      ko: { tag: '자가', addr: '127.0.0.1', big: '본인 거주 대저택', hook: '방 1,677만 개, 1인 가구', stk: '매매 불가' } },
    { id: 'priv', tone: 'green', tilt: -.6, r: -7,
      en: { tag: 'Private', addr: '192.168.0.1', big: 'Cozy starter home', hook: 'Same address as next door', stk: 'RESIDENTS ONLY' },
      ko: { tag: '사설', addr: '192.168.0.1', big: '단지 내 전용', hook: '옆집도 같은 번지', stk: '외부인 불가' } },
    { id: 'cgn', tone: 'orange', tilt: .8, r: -10,
      en: { tag: 'Shared', addr: '100.64.0.0/10', big: 'One door, many tenants', hook: 'A sublet of a sublet', stk: 'NO VACANCY' },

  const env = Object.assign(document.createElement('div'), { className: 'env' });
  env.setAttribute('aria-hidden', 'true');
  env.innerHTML = '<svg viewBox="0 0 24 18"><rect x="1" y="1" width="22" height="16" rx="1.5" fill="#fff" stroke="#1f2731" stroke-width="1.5"/><path d="M1.6 2 L12 10.2 L22.4 2" fill="none" stroke="#1f2731" stroke-width="1.5" stroke-linejoin="round"/><rect x="16.2" y="3.6" width="4.4" height="4" fill="#2f6fd1"/></svg>';
  document.body.append(env);
  const bez = (a, c, b, t) => (1 - t) * (1 - t) * a + 2 * (1 - t) * t * c + t * t * b;
  function loopback() {
    if (reduce) return;
    const s = sheets.loop.getBoundingClientRect();
    const house = $('.v4').getBoundingClientRect();
    const rr = road.getBoundingClientRect();
    const w = env.offsetWidth, h = env.offsetHeight;
    // Out of the listing, down to the doorstep, a U-turn there and straight back in.
    const P = [s.left + s.width / 2 - w / 2, s.top + s.height * .45 - h / 2];
    const T = [Math.min(house.right - w * 1.2, P[0] + s.width * .7), rr.top + rr.height * .12 - h / 2];
    const out = [P[0] + (T[0] - P[0]) * .15, P[1] - s.height * .35];
    const back = [T[0] + (T[0] - P[0]) * .5 + w, P[1] + (T[1] - P[1]) * .35];
    const frames = [];
    const N = 7;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      frames.push({ transform: `translate(${bez(P[0], out[0], T[0], t)}px, ${bez(P[1], out[1], T[1], t)}px) scale(${.35 + .65 * Math.min(1, t * 4)}) rotate(${-10 + 22 * t}deg)`,
        opacity: i === 0 ? 0 : 1, offset: t * .44, easing: i === 0 ? 'ease-out' : 'linear' });
    }
    // At the doorstep: a squash, an about-face, and home again.
    frames.push({ transform: `translate(${T[0]}px, ${T[1] + h * .1}px) scale(1.15, .8) rotate(0deg)`, opacity: 1, offset: .5 });
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      frames.push({ transform: `translate(${bez(T[0], back[0], P[0], t)}px, ${bez(T[1], back[1], P[1], t)}px) scale(${-(1 - .65 * Math.max(0, t * 4 - 3))}, ${1 - .65 * Math.max(0, t * 4 - 3)}) rotate(${12 - 20 * t}deg)`,
        opacity: i === N ? 0 : 1, offset: .58 + t * .42 });
    }
    const tilt = getComputedStyle(sheets.loop).rotate;
    env.animate(frames, { duration: 1250, easing: 'linear' }).finished.then(() => {
      sheets.loop.animate([{ rotate: tilt }, { rotate: '-5deg' }, { rotate: '4deg' }, { rotate: '-2deg' }, { rotate: tilt }], { duration: 440, easing: 'ease-out' });
    }).catch(() => {});
  }

  // ---------- truck ----------
  const START = 31;
  const truckPct = () => truck.getBoundingClientRect().width / road.getBoundingClientRect().width * 100;
  const endPct = () => Math.min(76, 97 - truckPct());
  // Brakes with the nose just over the lot line between the two buildings.
  const stallPct = () => {
    const rr = road.getBoundingClientRect();
    const line = (v6.getBoundingClientRect().left - rr.left) / rr.width * 100;
    return Math.max(START + 8, line - truckPct() * .8);
  };
  const SLOTS = [3, 9.5, 16, 22.5, 29];
  let left = []; // items left behind at the old house
  let loaded = null;
  let moveGen = 0;
  let tries = 0;

  function drive(from, to, dur, easing) {
    stop(truck);
    truck.style.left = to + '%';
    if (reduce || dur === 0) return Promise.resolve();
    return truck.animate([{ left: from + '%' }, { left: to + '%' }], { duration: dur, easing }).finished.catch(() => {});
  }
  function load(b) {
    loaded = b;
    cargo.innerHTML = ART[b.key];
    cargo.style.visibility = 'visible';
  }
  function say(b, x) {
    const [who, line] = b[TTY.lang] || b.en;
    bubble.innerHTML = '';
    bubble.append(Object.assign(document.createElement('b'), { textContent: who }), document.createTextNode(line));
    bubble.classList.add('on');
    // Right of the item, on the sidewalk, tail pointing back at it.
    const rr = road.getBoundingClientRect();
    const it = left[left.length - 1];
    const ir = it ? it.getBoundingClientRect() : { right: rr.left + x / 100 * rr.width };
    bubble.style.left = Math.max(4, ir.right - rr.left + 10) + 'px';
    if (!reduce) bubble.animate([{ transform: 'scale(.6)', opacity: 0 }, { transform: 'scale(1.04)', opacity: 1, offset: .7 }, { transform: 'none', opacity: 1 }],
      { duration: 280, easing: 'ease-out' }).finished.catch(() => {});
  }
  function hush() { bubble.classList.remove('on'); }
  function clearLeft() { left.forEach((el) => el.remove()); left = []; }

  function dropOff(b, slot, animate) {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<div class="item-in">${ART[b.key]}</div>`;
    el.style.left = SLOTS[slot] + 2.4 + '%';
    road.append(el);
    left.push(el);
    if (!animate) return Promise.resolve(el);
    // From the top of the truck back to the old doorstep, in one hop.
    const rr = road.getBoundingClientRect();
    const c = cargo.getBoundingClientRect();
    const e = el.getBoundingClientRect();
    const fromX = (c.left + c.width / 2) - (e.left + e.width / 2);
    const fromY = c.bottom - e.bottom;
    const up = Math.min(fromY, 0) - rr.height * 1.1;
    cargo.style.visibility = 'hidden';
    const inner = el.firstElementChild;
    el.animate([
      { transform: `translate(${fromX}px, ${fromY}px)` },
      { transform: `translate(${fromX * .45}px, ${up}px)`, easing: 'cubic-bezier(.3, 0, .7, 1)', offset: .45 },
      { transform: 'translate(0, 0)' },
    ], { duration: 900, easing: 'cubic-bezier(.2, .7, .4, 1)' });
    inner.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-340deg)', offset: .9 }, { transform: 'rotate(-360deg) scale(1.15, .8)', offset: .95 }, { transform: 'rotate(-360deg)' }],
      { duration: 960, easing: 'ease-out' });
    return sleep(980).then(() => el);
  }

  let tagT = null;
  function showPunch() {
    const was = punch.classList.contains('on');
    punch.classList.add('on');
    if (reduce) { showTag(); return; }
    // The tag follows the first drop a beat later, even if someone keeps moving meanwhile.
    if (!was) { clearTimeout(tagT); tagT = setTimeout(showTag, 1800); } else showTag();
    if (!was) {
      punch.animate([
        { transform: 'translateY(-160%) rotate(-2deg)' },
        { transform: 'translateY(8%) rotate(1.4deg)', offset: .6 },
        { transform: 'translateY(-2%) rotate(-.6deg)', offset: .82 },
        { transform: 'none' },
      ], { duration: 820, easing: 'cubic-bezier(.3, .7, .4, 1)' });
    } else {
      punch.animate([{ transform: 'none' }, { transform: 'translateY(4%) rotate(-1deg)' }, { transform: 'rotate(.6deg)' }, { transform: 'none' }], { duration: 420 });
    }
  }
  // The tag: the new home gets a sticker too.
  const half = $('#half');
  function showTag() {
    if (half.classList.contains('on')) return;
    slam(half, v6);
  }

  // One move: drive toward IPv6, brake, one thing hops off and walks back home, the rest moves in.
  async function moveTo6(fromAuto) {
    const g = ++moveGen;
    const live = () => g === moveGen;
    const b = BLOCKERS[tries % BLOCKERS.length];
    if (tries > 0 && tries % BLOCKERS.length === 0) clearLeft();
    const slot = left.length;
    tries++;
    hush();
    truck.classList.remove('haz');
    stop(truck);
    load(b);
    if (reduce) {
      truck.style.left = endPct() + '%';
      const el = await dropOff(b, slot, false);
      cargo.style.visibility = 'hidden';
      say(b, parseFloat(el.style.left));
      showPunch();
      return;
    }
    rollOut();
    const at = parseFloat(truck.style.left);
    if (!(at >= START - .5 && at <= START + .5)) {
      if (at > START) {
        // Back at the old house with a fresh load.
        await truck.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160 }).finished.catch(() => {});
        if (!live()) return;
        truck.style.left = START + '%';
        truck.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200 });
        await sleep(260);
      } else {
        await drive(-30, START, 800, 'cubic-bezier(.2, .7, .3, 1)');
      }
      if (!live()) return;
    }
    const stall = stallPct();
    await drive(START, stall, 1250, 'cubic-bezier(.5, 0, .3, 1)');
    if (!live()) return;
    truck.classList.add('haz');
    truck.firstElementChild.animate([{ transform: 'none' }, { transform: 'rotate(2.2deg) translateX(2%)' }, { transform: 'rotate(-.8deg)' }, { transform: 'none' }],
      { duration: 380, easing: 'ease-out' });
    await sleep(420);
    if (!live()) return;
    const el = await dropOff(b, slot, true);
    if (!live()) return;
    say(b, parseFloat(el.style.left));
    await sleep(1350);
    if (!live()) return;
    truck.classList.remove('haz');
    await drive(stall, endPct(), 1050, 'cubic-bezier(.4, 0, .3, 1)');
    if (!live()) return;
    showPunch();
  }

  // ---------- listing card ----------
  const card = $('#card');
  const scrim = $('#scrim');
  let opener = null;
  function openCard(id) {
    const c = CARDS[id];
    const t = c[TTY.lang] || c.en;
    card.style.setProperty('--tone', TONE[c.tone]);
    $('#card-kind').textContent = t.kind;
    $('#card-no').textContent = 'No. ' + c.no;
    $('#card-addr').textContent = t.addr;
    $('#card-name').textContent = t.name;
    const rows = $('#card-rows');
    rows.innerHTML = '';
    t.rows.forEach(([k, v]) => {
      rows.append(Object.assign(document.createElement('dt'), { textContent: k }), Object.assign(document.createElement('dd'), { innerHTML: v }));
    });
    const notes = $('#card-notes');
    notes.innerHTML = '';
    t.notes.forEach((n) => notes.append(Object.assign(document.createElement('li'), { textContent: n })));
    $('#card-agent-k').textContent = ko ? (id === 'v6' ? '분양 상담사 한마디' : '중개사 한마디') : (id === 'v6' ? 'Leasing office says' : 'Agent says');
    const agent = $('#card-agent');
    agent.innerHTML = '';
    if (ko) {
      const k = document.createElement('font-kku');
      k.setAttribute('font', 'pilgi');
      k.setAttribute('size', 'clamp(16px, 2.8cqh, 22px)');
      k.className = 'k-agent';
      k.textContent = t.agent;
      agent.append(k);
    } else agent.textContent = t.agent;
    $('#card-x').setAttribute('aria-label', ko ? '닫기' : 'Close');
    scrim.hidden = false;
    card.hidden = false;
    card.scrollTop = 0;
    if (!reduce) card.animate([{ transform: 'translateY(12px) scale(.96)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 220, easing: 'ease-out' });
    $('#card-x').focus({ preventScroll: true });
  }
  function closeCard() {
    if (card.hidden) return;
    card.hidden = true;
    scrim.hidden = true;
    if (opener) opener.focus({ preventScroll: true });
    opener = null;
  }
  const isOpen = () => !card.hidden;

  // ---------- the scene, start to end ----------
  let auto = false;
  let idle = null;

  function resetScene() {
    clearLeft();
    tries = 0;
    moveGen++;
    hush();
    closeCard();
    stickers.forEach((s) => s.classList.remove('on'));
    Object.values(sheets).forEach((s) => s.classList.remove('hi'));
    [ban, gauge].forEach((el) => el.classList.remove('hi'));
    punch.classList.remove('on');
    [truck, weed, weedB, weedS, punch, env, half].forEach(stop);
    half.classList.remove('on');
    clearTimeout(tagT);
    truck.classList.remove('haz');
    truck.style.left = '-30%';
    cargo.style.visibility = 'visible';
    weed.style.left = '110%';
  }

  function finalScene() {
    stickers.forEach((s) => s.classList.add('on'));
    weed.style.left = linePct() + '%'; // came to rest at the lot line
    tries = 0;
    moveTo6(true);
  }

  function hi(el, ms) {
    el.classList.add('hi');
    later(ms, () => el.classList.remove('hi'));
  }

  function play() {
    clearTimers();
    resetScene();
    auto = true;
    if (reduce) { finalScene(); return; }
    // 0.55–2.3 s: every listing gets its sticker (sold out). Then, a beat later, the model home
    // next door gleams and a tumbleweed rolls in front of it and stops at the lot line (empty).
    stickers.forEach((s, i) => later(550 + i * 290, () => slam(s)));
    later(2200, () => {
      rollIn();
      glint.animate([{ transform: 'translateX(-80%)' }, { transform: 'translateX(80%)' }], { duration: 1300, easing: 'ease-in-out' });
    });
    // 3.6–9 s: the details worth reading. 127.0.0.1 sends a letter that comes straight back.
    later(3600, () => hi(sheets.loop, 1800));
    later(3800, loopback);
    later(5500, () => hi(sheets.priv, 1800));
    later(7400, () => { hi(ban, 1800); hi(gauge, 1800); glint.animate([{ transform: 'translateX(-80%)' }, { transform: 'translateX(80%)' }], { duration: 1100, easing: 'ease-in-out' }); });
    // 9.2 s: a moving truck pulls up; 10 s: someone presses "Move to IPv6" and the tumbleweed
    // clears off. The truck brakes at the lot line (≈11.3 s), the printer hops off (≈11.7–12.7 s)
    // and says why, the truck moves on (≈14–15 s), the banner drops (≈15–15.9 s) and the model
    // home gets its own sticker (≈16.9 s). The page holds there.
    later(9200, () => { load(BLOCKERS[0]); drive(-30, START, 800, 'cubic-bezier(.2, .7, .3, 1)'); });
    later(10000, () => {
      moveBtn.classList.add('press');
      later(220, () => moveBtn.classList.remove('press'));
      moveTo6(true);
    });
    later(24000, () => { if (auto) play(); });
  }

  function takeOver() {
    if (auto) {
      auto = false;
      clearTimers();
      stickers.forEach((s) => s.classList.add('on'));
      Object.values(sheets).forEach((s) => s.classList.remove('hi'));
      [ban, gauge].forEach((el) => el.classList.remove('hi'));
    }
    clearTimeout(idle);
    const rest = () => { idle = setTimeout(() => (isOpen() ? rest() : play()), 15000); };
    if (!reduce) rest();
  }

  // ---------- input ----------
  addEventListener('pointerdown', takeOver, { passive: true });
  addEventListener('keydown', (e) => {
    takeOver();
    if (e.key === 'Escape') closeCard();
  });
  sheetsEl.addEventListener('click', (e) => {
    const b = e.target.closest('.sheet');
    if (!b) return;
    opener = b;
    openCard(b.dataset.id);
  });
  v6.addEventListener('click', () => { opener = v6; openCard('v6'); });
  $('#card-x').addEventListener('click', closeCard);
  scrim.addEventListener('click', closeCard);
  moveBtn.addEventListener('click', () => { closeCard(); moveTo6(false); });

  if (reduce) finalScene();
  TTY.onShow(() => { if (!reduce) play(); });
  const loaded2 = new Promise((r) => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
  Promise.all([loaded2, document.fonts.ready]).then(TTY.ready);
})();
</script>
</body>
</html>
