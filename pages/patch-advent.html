<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Patch Calendar | tty.link</title>
<script src="/pages/_kit.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Lexend:wght@400;600;700&family=Red+Hat+Mono:wght@500;700&family=Gowun+Dodum&display=swap">
<script src="/vendor/font-kku/font-kku.js" data-fonts="geumbak dunggeun sticker"></script>
<style>
  /* A countdown calendar built into a server rack: 24 drive bays, a patch behind each
     door, a receipt printer for the notes. The last door is the one everyone knows. */
  :root {
    --night-1: #1a2645;
    --night-2: #0e1530;
    --rack: #262b36;
    --rack-edge: #3a4150;
    --door-1: #d5dae1;
    --door-2: #9ea6b2;
    --ink: #1c2230;
    --paper: #fbfaf7;
    --led: #38d996;
    --amber: #ffb84d;
    --warm-1: #ffcf5c;
    --warm-2: #ff8a8a;
    --warm-3: #8fd3ff;
    --text: #e9eef8;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    container-type: size;
    position: relative;
    overflow: hidden;
    background: radial-gradient(90cqmax 70cqmax at 50% 0%, var(--night-1), var(--night-2) 70%);
    color: var(--text);
    font-family: 'Lexend', 'Gowun Dodum', system-ui, sans-serif;
  }
  .lang-ko body { font-family: 'Gowun Dodum', 'Lexend', sans-serif; word-break: keep-all; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--warm-1); outline-offset: 3px; }

  .snow { position: absolute; inset: 0; pointer-events: none; }
  .snow i { position: absolute; top: -2%; width: var(--s); height: var(--s); border-radius: 50%; background: rgba(255,255,255,.75); animation: fall var(--t) linear var(--d) infinite; }
  @keyframes fall { to { transform: translate(var(--x), 106cqh); } }

  .scene {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: auto auto 1fr;
    justify-items: center;
    align-content: start;
    gap: 2.2cqh;
    padding: 3.4cqh 4cqw;
  }
  .title { text-align: center; }
  .title h1 { font-family: 'Lilita One', 'Lexend', sans-serif; font-weight: 400; font-size: clamp(26px, 6.8cqmin, 58px); line-height: 1; color: #fff3cf; letter-spacing: .01em; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .title p { margin-top: .9cqh; font-size: clamp(12px, 2.2cqmin, 17px); color: #b8c4dc; }
  .lang-ko .title p { margin-top: 1.4cqh; }

  /* ---- The rack ---- */
  .rack {
    position: relative;
    container-type: inline-size;
    width: min(88cqw, 700px, calc((100cqh - 230px) * 1.62));
    padding: 6cqi 7cqi 5cqi;
    border-radius: 3cqi;
    background: linear-gradient(var(--rack-edge), var(--rack));
    box-shadow: inset 0 0 0 .6cqi rgba(255,255,255,.05), 0 2.4cqi 6cqi rgba(0,0,0,.45);
  }
  .ear { position: absolute; top: 4cqi; bottom: 4cqi; width: 3.6cqi; display: flex; flex-direction: column; justify-content: space-between; }
  .ear.l { left: 1.6cqi; } .ear.r { right: 1.6cqi; }
  .ear i { width: 2.2cqi; height: 2.2cqi; border-radius: 50%; background: #11151d; box-shadow: inset 0 .4cqi 0 rgba(255,255,255,.15); }
  .lights { position: absolute; left: 4cqi; top: -2.6cqi; width: calc(100% - 8cqi); height: 6cqi; overflow: visible; pointer-events: none; }
  .lights svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .lights path { fill: none; stroke: #4a5568; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
  .lights i { position: absolute; width: 1.9cqi; height: 2.4cqi; border-radius: 50% 50% 45% 45%; translate: -50% -20%; box-shadow: 0 0 1.6cqi currentColor; background: currentColor; animation: twinkle 1.8s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: .45; } to { opacity: 1; } }

  .bays { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1.6cqi; perspective: 600px; }
  .bay {
    position: relative;
    aspect-ratio: 1.45;
    border-radius: 1.2cqi;
    background: #131821;
    box-shadow: inset 0 .5cqi 1cqi rgba(0,0,0,.6);
  }
  .inside { position: absolute; inset: 0; display: grid; place-items: center; }
  .inside svg { width: 62%; height: 62%; }
  .door {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    padding: 1.2cqi 1.4cqi;
    border: 0;
    border-radius: 1.2cqi;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 .4cqi, transparent .4cqi 1.2cqi) 0 0 / 100% 52% no-repeat,
      linear-gradient(160deg, var(--door-1), var(--door-2));
    color: var(--ink);
    transform-origin: 0 50%;
    transition: transform .55s cubic-bezier(.3, 1.2, .5, 1), opacity .55s;
    cursor: pointer;
    backface-visibility: hidden;
  }
  .door b { font-family: 'Lexend', sans-serif; font-size: 4.2cqi; font-weight: 700; line-height: 1; text-align: left; }
  .door .led { width: 1.5cqi; height: 1.5cqi; border-radius: 50%; background: var(--amber); box-shadow: 0 0 1.2cqi var(--amber); animation: blink 1.3s steps(2, end) infinite; animation-delay: var(--d); }
  @keyframes blink { 50% { opacity: .25; } }
  .bay.open .door { transform: rotateY(-108deg); opacity: .0; pointer-events: none; }
  .bay.open .inside { animation: pop .45s cubic-bezier(.3, 1.5, .5, 1) both; }
  @keyframes pop { from { transform: scale(.4); } }
  .bay.last .door { background: linear-gradient(160deg, #ffe8a3, #e8b34a); }
  .bay.last .door .led { background: var(--warm-2); box-shadow: 0 0 1.4cqi var(--warm-2); }
  .bay.green .inside svg .glow { fill: var(--led); }

  .rack.dark .bay { filter: brightness(.45); transition: filter .4s; }
  .rack.dark .door .led { animation: none; opacity: .15; }

  /* ---- Receipt printer ---- */
  .printer { position: relative; container-type: inline-size; width: min(88cqw, 640px); display: grid; justify-items: center; align-content: start; }
  .slot { width: 72%; height: clamp(10px, 1.6cqh, 16px); border-radius: 999px; background: #0a0d15; box-shadow: 0 1px 0 rgba(255,255,255,.1); }
  .receipt {
    width: 64%;
    margin-top: -.6em;
    padding: 1.2em 1.3em 1em;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Red Hat Mono', 'Gowun Dodum', monospace;
    font-size: clamp(11px, 1.9cqmin, 15px);
    line-height: 1.45;
    -webkit-mask: radial-gradient(.5em at 50% 100%, transparent 98%, #000) 0 0 / 1em 100%;
    mask: radial-gradient(.5em at 50% 100%, transparent 98%, #000) 0 0 / 1em 100%;
    padding-bottom: 1.4em;
  }
  .lang-ko .receipt { font-family: 'Gowun Dodum', 'Red Hat Mono', sans-serif; }
  .receipt .row { display: grid; grid-template-columns: 2.6em 1fr; gap: .5em; opacity: .55; }
  .receipt .row:last-child { opacity: 1; font-weight: 700; }
  .lang-ko .receipt .row:last-child { font-weight: 400; }
  .receipt .no { color: #8a8f99; }
  .receipt:empty { display: none; }

  /* ---- Restart ---- */
  .restart {
    position: absolute;
    left: 50%;
    top: 50%;
    container-type: inline-size;
    width: min(86cqw, 420px);
    padding: clamp(18px, 3.6cqmin, 30px);
    border-radius: 22px;
    background: #fffaf0;
    color: var(--ink);
    text-align: center;
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
    translate: -50% -50%;
    opacity: 0;
    pointer-events: none;
  }
  .restart.on { opacity: 1; pointer-events: auto; }
  .restart h2 { font-family: 'Lilita One', 'Lexend', sans-serif; font-weight: 400; font-size: 9cqi; line-height: 1.05; }
  .restart h2 > font-kku { color: var(--ink); }
  .restart p { margin-top: 2cqi; font-size: 4.2cqi; color: #5a6274; }
  .restart .now {
    display: grid;
    place-items: center;
    width: 34cqi;
    height: 34cqi;
    margin: 5cqi auto 3cqi;
    border: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #6fe3b4, #1fa676);
    color: #fff;
    font-size: 4.6cqi;
    font-weight: 700;
    box-shadow: 0 1.4cqi 0 #157a56, 0 0 0 1.6cqi rgba(56, 217, 150, .18);
    cursor: pointer;
    animation: breathe 2.2s ease-in-out infinite;
  }
  @keyframes breathe { 50% { box-shadow: 0 1.4cqi 0 #157a56, 0 0 0 3.4cqi rgba(56, 217, 150, .1); } }
  .restart .later { border: 0; background: none; color: #6a7286; font-size: 3.8cqi; text-decoration: underline; text-underline-offset: .2em; cursor: pointer; }

  .done {
    position: absolute;
    left: 50%;
    bottom: 6cqh;
    padding: .7em 1.2em;
    border-radius: 999px;
    background: #fff3cf;
    color: var(--ink);
    font-weight: 700;
    font-size: clamp(13px, 2.4cqmin, 19px);
    white-space: nowrap;
    translate: -50% 0;
    opacity: 0;
  }
  .done > font-kku { color: var(--ink); }
  .ring { position: absolute; left: 50%; top: 50%; width: clamp(60px, 14cqmin, 110px); translate: -50% -50%; opacity: 0; }
  .ring circle { fill: none; stroke-width: 6; }

  .title h1 > font-kku { color: #fff3cf; }

  @media (prefers-reduced-motion: reduce) {
    .snow i, .lights i, .door .led, .restart .now { animation: none; }
    .door { transition: none; }
  }
</style>
</head>
<body>
<div class="snow" aria-hidden="true"></div>
<div class="scene">
  <header class="title">
    <h1>
      <span data-lang="en">The Patch Calendar</span>
      <span data-lang="ko"><font-kku font="geumbak" size="clamp(28px, 7cqmin, 60px)">패치 달력</font-kku></span>
    </h1>
    <p>
      <span data-lang="en">One door a day. One fix behind each.</span>
      <span data-lang="ko">하루에 문 하나, 문마다 패치 하나.</span>
    </p>
  </header>

  <div class="rack">
    <div class="lights" aria-hidden="true">
      <svg viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M0 2 Q 12.5 8 25 2 T 50 2 T 75 2 T 100 2"/></svg>
    </div>
    <div class="ear l"><i></i><i></i><i></i></div>
    <div class="ear r"><i></i><i></i><i></i></div>
    <div class="bays"></div>
  </div>

  <div class="printer">
    <div class="slot"></div>
    <div class="receipt" aria-live="polite"></div>
  </div>
</div>

<section class="restart" role="dialog" aria-modal="false">
  <h2></h2>
  <p class="why"></p>
  <button class="now" type="button"></button>
  <button class="later" type="button"></button>
</section>
<svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
  <circle cx="50" cy="50" r="42" stroke="rgba(255,255,255,.15)"/>
  <circle class="arc" cx="50" cy="50" r="42" stroke="#38d996" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="rotate(-90 50 50)"/>
</svg>
<p class="done"></p>

<script>
(() => {
  const ko = TTY.lang === 'ko';
  const $ = (s) => document.querySelector(s);
  const rack = $('.rack');
  const bays = $('.bays');
  const receipt = $('.receipt');
  const restart = $('.restart');
  const nowBtn = $('.restart .now');
  const laterBtn = $('.restart .later');
  const done = $('.done');
  const ring = $('.ring');

  const T = TTY.t({
    en: {
      notes: [
        "Updated: everyone's printer driver. Again.",
        "Removed: the 'remember me' box that remembered too much.",
        "Rotated: 'Spring2026!' to 'Summer2026!'.",
        'Closed: port 22 on the coffee machine.',
        'Fixed: the cookie banner that asked for cookies twice.',
        "Patched: the intern's 'temporary' admin account (since 2019).",
        "Retired: the security question about your first pet.",
        'Renewed: the certificate that expired at 3 a.m. on a Sunday.',
        'Disabled: macros in the expenses spreadsheet.',
        'Moved: the backup off the disk it was backing up.',
        'Added: a second factor. Not the same phone, please.',
        "Rate-limited: the login page's biggest fan.",
        'Sanitised: the search box that ran SQL for fun.',
        'Expired: the session that started in 2023.',
        "Revoked: the API key in the README.",
        'Hardened: the defaults. Softened: the error messages.',
        'Logged: everything. Read: still nothing.',
        "Encrypted: the laptop. Labelled: 'nothing interesting'.",
        'Uninstalled: the toolbar nobody installed.',
        'Reset: the router, by unplugging it and plugging it back in.',
        'Applied: least privilege. Expected: grumbling.',
        'Revised: the incident plan. It now has a page 2.',
        'Backed up: the backups.',
        'Restart required.',
      ],
      restartTitle: 'Restart required.',
      restartWhy: '23 patches are waiting for one small act of courage.',
      now: 'Restart now',
      later: 'Remind me in 10 minutes',
      snoozed: 'It has been 10 minutes.',
      done: 'All 24 patches applied. Happy uptime.',
    },
    ko: {
      notes: [
        '업데이트: 모두의 프린터 드라이버. 또.',
        "삭제: 너무 많은 걸 기억하던 '로그인 유지' 체크박스",
        "변경: 'Spring2026!'을 'Summer2026!'로",
        '차단: 커피 머신의 22번 포트',
        '수정: 쿠키 동의를 두 번 묻던 쿠키 배너',
        "정리: 인턴의 '임시' 관리자 계정 (2019년부터 임시)",
        "폐기: '첫 반려동물 이름' 보안 질문",
        '갱신: 일요일 새벽 3시에 만료되던 인증서',
        '비활성화: 경비 정산 엑셀의 매크로',
        '이동: 원본과 같은 디스크에 있던 백업',
        '추가: 2단계 인증. 같은 폰 말고요.',
        '제한: 로그인 페이지의 열혈 팬',
        '필터링: 재미로 SQL을 실행하던 검색창',
        '만료: 2023년에 시작된 세션',
        '폐기: README에 적혀 있던 API 키',
        '강화: 기본 설정. 완화: 에러 메시지 말투.',
        '기록: 전부. 읽은 사람: 아직 없음.',
        "암호화: 노트북. 이름표: '별거 없음'",
        '삭제: 아무도 설치한 적 없는 툴바',
        '초기화: 공유기. 뽑았다가 다시 꽂아서.',
        '적용: 최소 권한 원칙. 예상: 원성.',
        '개정: 침해 대응 계획서. 이제 2쪽도 있음.',
        '백업: 백업의 백업',
        '재시작이 필요합니다.',
      ],
      restartTitle: '재시작이 필요합니다',
      restartWhy: '패치 23개가 작은 용기 하나를 기다리고 있어요.',
      now: '지금 재시작',
      later: '10분 뒤에 다시 알림',
      snoozed: '10분 지났습니다.',
      done: '패치 24개 적용 완료. 오늘도 무중단.',
    },
  });

  /* ---- Snow and lights ---- */
  const snow = $('.snow');
  for (let i = 0; i < 46; i++) {
    const f = document.createElement('i');
    f.style.left = Math.random() * 100 + '%';
    f.style.setProperty('--s', (2 + Math.random() * 4).toFixed(1) + 'px');
    f.style.setProperty('--t', (7 + Math.random() * 8).toFixed(1) + 's');
    f.style.setProperty('--d', (-Math.random() * 14).toFixed(1) + 's');
    f.style.setProperty('--x', ((Math.random() - .5) * 60).toFixed(0) + 'px');
    if (TTY.reduce) f.style.top = Math.random() * 100 + '%';
    snow.append(f);
  }
  const lights = $('.lights');
  const warm = ['#ffcf5c', '#ff8a8a', '#8fd3ff', '#b6f09c'];
  // Bulbs hang on the wire: it dips to y = 5 (of 10) halfway between its peaks every 25 units.
  for (let i = 0; i < 13; i++) {
    const x = 3 + i * (94 / 12);
    const y = 2 + 3 * Math.sin(((x % 25) / 25) * Math.PI);
    const b = document.createElement('i');
    b.style.left = x + '%';
    b.style.top = y * 10 + '%';
    b.style.color = warm[i % warm.length];
    b.style.animationDelay = (i * .23).toFixed(2) + 's';
    lights.append(b);
  }

  /* ---- Bays ---- */
  const PATCH = '<svg viewBox="0 0 60 40" aria-hidden="true"><g transform="rotate(-18 30 20)"><rect x="4" y="12" width="52" height="16" rx="8" fill="#f2c9a0"/><rect x="21" y="12" width="18" height="16" fill="#e7b386"/><circle cx="26" cy="17" r="1.3" fill="#c98f5f"/><circle cx="34" cy="17" r="1.3" fill="#c98f5f"/><circle cx="26" cy="23" r="1.3" fill="#c98f5f"/><circle cx="34" cy="23" r="1.3" fill="#c98f5f"/></g><circle class="glow" cx="52" cy="6" r="3.5" fill="#ffb84d"/></svg>';
  const POWER = '<svg viewBox="0 0 60 40" aria-hidden="true"><path d="M30 6 V20" stroke="#38d996" stroke-width="4" stroke-linecap="round"/><path d="M20 11 A13 13 0 1 0 40 11" stroke="#38d996" stroke-width="4" fill="none" stroke-linecap="round"/></svg>';
  const order = Array.from({ length: 24 }, (_, i) => i);
  const all = order.map((i) => {
    const bay = document.createElement('div');
    bay.className = 'bay' + (i === 23 ? ' last' : '');
    bay.innerHTML = `<div class="inside">${i === 23 ? POWER : PATCH}</div><button class="door" type="button"><b>${i + 1}</b><i class="led"></i></button>`;
    bay.querySelector('.led').style.setProperty('--d', (Math.random() * 1.3).toFixed(2) + 's');
    bay.querySelector('.door').setAttribute('aria-label', TTY.t({ en: `Door ${i + 1}`, ko: `${i + 1}번 문` }));
    bays.append(bay);
    return bay;
  });
  // Tall screens get a 4 × 6 rack.
  const fit = () => { bays.style.gridTemplateColumns = innerWidth < innerHeight * .9 ? 'repeat(4, 1fr)' : 'repeat(6, 1fr)'; };
  fit();
  addEventListener('resize', fit);

  /* ---- Receipt ---- */
  const printed = [];
  function print(i, quick) {
    printed.push(i);
    const rows = printed.slice(-3).map((n) => `<p class="row"><span class="no">#${String(n + 1).padStart(2, '0')}</span><span></span></p>`).join('');
    receipt.innerHTML = rows;
    receipt.querySelectorAll('.row').forEach((row, k) => { row.lastChild.textContent = T.notes[printed.slice(-3)[k]]; });
    if (!TTY.reduce && !quick) receipt.animate([{ transform: 'translateY(-14%)', clipPath: 'inset(0 0 40% 0)' }, { transform: 'none', clipPath: 'inset(0)' }], { duration: 380, easing: 'steps(6, end)' });
  }
  function open(i, quick) {
    const bay = all[i];
    if (bay.classList.contains('open')) return false;
    bay.classList.add('open');
    print(i, quick);
    return true;
  }

  /* ---- Restart ---- */
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  let restartTitle = '';
  function showRestart(snoozed) {
    const title = snoozed ? T.snoozed : T.restartTitle;
    if (restartTitle !== title) {
      restartTitle = title;
      if (ko) {
        const el = document.createElement('font-kku');
        el.setAttribute('font', 'dunggeun');
        el.setAttribute('size', '8.4cqi');
        el.textContent = title;
        restart.querySelector('h2').replaceChildren(el);
      } else {
        restart.querySelector('h2').textContent = title;
      }
    }
    restart.querySelector('.why').textContent = T.restartWhy;
    nowBtn.textContent = T.now;
    laterBtn.textContent = T.later;
    restart.classList.add('on');
    if (!TTY.reduce) restart.animate([{ opacity: 0, transform: 'scale(.85)' }, { opacity: 1, transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.2,.9,.3,1.2)' });
  }
  async function snooze() {
    if (!TTY.reduce) await restart.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(30%) scale(.9)' }], { duration: 260, easing: 'ease-in' }).finished;
    restart.classList.remove('on');
  }
  let restarting = false;
  async function doRestart() {
    if (restarting) return;
    restarting = true;
    restart.classList.remove('on');
    all.forEach((b, i) => { if (!b.classList.contains('open')) { b.classList.add('open'); if (i < 23) printed.push(i); } });
    rack.classList.add('dark');
    ring.style.opacity = 1;
    const arc = ring.querySelector('.arc');
    if (!TTY.reduce) await arc.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 1600, easing: 'ease-in-out', fill: 'forwards' }).finished;
    ring.style.opacity = 0;
    rack.classList.remove('dark');
    for (const b of all) { b.classList.add('green'); if (!TTY.reduce) await wait(35); }
    receipt.innerHTML = '';
    if (ko) {
      const el = document.createElement('font-kku');
      el.setAttribute('font', 'dunggeun');
      el.setAttribute('size', 'clamp(15px, 2.6cqmin, 21px)');
      el.textContent = T.done;
      done.replaceChildren(el);
    } else {
      done.textContent = T.done;
    }
    done.style.opacity = 1;
    if (!TTY.reduce) done.animate([{ opacity: 0, transform: 'translateY(30%)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.2,.9,.3,1.1)' });
  }

  /* ---- Autoplay ---- */
  let run = 0;
  function resetAll() {
    restarting = false;
    all.forEach((b) => b.classList.remove('open', 'green'));
    printed.length = 0;
    receipt.innerHTML = '';
    restart.classList.remove('on');
    done.style.opacity = 0;
    rack.classList.remove('dark');
    ring.style.opacity = 0;
  }
  async function play() {
    const mine = ++run;
    const live = () => run === mine;
    while (live()) {
      resetAll();
      await wait(600);
      for (let i = 0; i < 23; i++) {
        if (!live()) return;
        open(i, i >= 6);
        await wait(i < 6 ? 950 : 190);
      }
      await wait(500); if (!live()) return;
      all[23].animate([{ transform: 'none' }, { transform: 'scale(1.08)' }, { transform: 'none' }], { duration: 500, iterations: 2 });
      await wait(900); if (!live()) return;
      open(23);
      await wait(600); if (!live()) return;
      showRestart(false);
      for (let k = 0; k < 2; k++) {
        await wait(1200); if (!live()) return;
        laterBtn.animate([{ transform: 'none' }, { transform: 'scale(.92)' }, { transform: 'none' }], { duration: 200 });
        await snooze(); await wait(500); if (!live()) return;
        showRestart(true);
      }
      await wait(1000); if (!live()) return;
      nowBtn.animate([{ transform: 'none' }, { transform: 'scale(.9)' }, { transform: 'none' }], { duration: 220 });
      await wait(220);
      await doRestart();
      await wait(5000);
    }
  }

  /* ---- A visitor opens doors ---- */
  bays.addEventListener('click', (e) => {
    const door = e.target.closest('.door');
    if (!door || !e.isTrusted) return;
    run++;
    if (restarting) resetAll();
    const i = all.indexOf(door.closest('.bay'));
    open(i);
    if (i === 23) setTimeout(() => showRestart(false), 400);
  });
  laterBtn.addEventListener('click', async (e) => { if (!e.isTrusted) return; run++; await snooze(); setTimeout(() => showRestart(true), 1500); });
  nowBtn.addEventListener('click', (e) => { if (!e.isTrusted) return; run++; doRestart(); });

  /* ---- Start ---- */
  if (TTY.reduce) {
    for (let i = 0; i < 24; i++) all[i].classList.add('open');
    printed.push(21, 22, 23);
    doRestart();
  }
  TTY.onShow(() => { if (!TTY.reduce) play(); });
  const loaded = new Promise((r) => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
  Promise.all([loaded, document.fonts.ready]).then(TTY.ready);
})();
</script>
