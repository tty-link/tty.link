<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switch Sommelier | tty.link</title>
<script src="/pages/_kit.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Homemade+Apple&family=Gowun+Batang:wght@400;700&display=swap">
<script src="/vendor/font-kku/font-kku.js" data-fonts="geumbak sebul pilgi"></script>
<style>
  /* A wine list for keyboard switches. Each one is swirled, tasted (pressed, three times)
     and described with the seriousness it deserves. */
  :root {
    --plum-1: #3a2440;
    --plum-2: #1b1120;
    --card: #f6f2f5;
    --ink: #2a1d2c;
    --soft: #77677a;
    --rule: #b9a3b8;
    --gold: #d8b46a;
    --sw: #c0392b;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    container: page / size;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(40cqmax 30cqmax at 22% 72%, rgba(255, 190, 120, .16), transparent 70%),
      radial-gradient(110cqmax 90cqmax at 30% 20%, var(--plum-1), var(--plum-2) 75%);
    color: var(--card);
    font-family: 'Newsreader', 'Gowun Batang', Georgia, serif;
  }
  .lang-ko body { font-family: 'Gowun Batang', 'Newsreader', serif; word-break: keep-all; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .page {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto minmax(0, .9fr) auto;
    gap: 1.8cqh;
    padding: 3.6cqh 5cqw 3.4cqh;
  }
  .head h1 { font-family: 'Italiana', serif; font-weight: 400; font-size: clamp(28px, 7cqmin, 64px); line-height: 1; color: #f3e6c9; letter-spacing: .01em; }
  .head h1 > font-kku { color: #f3e6c9; }
  .head p { margin-top: .8cqh; font-size: clamp(13px, 2.2cqmin, 18px); font-style: italic; color: #cdb9cc; }
  .lang-ko .head p { font-style: normal; margin-top: 1.4cqh; }

  /* ---- Tasting stage: glass, key, sound ---- */
  .stage { display: grid; grid-template-columns: 1fr 1.25fr; grid-template-rows: 1fr auto; align-items: end; justify-items: center; min-height: 0; gap: 0 3cqw; }
  .glass { width: 100%; max-width: 250px; height: 100%; max-height: 360px; }
  .key { width: 100%; max-width: 360px; height: 100%; max-height: 360px; cursor: pointer; }
  .wave { grid-column: 1 / -1; width: 100%; max-width: 560px; height: clamp(34px, 8cqmin, 76px); }
  .wave path { fill: none; stroke: var(--wave, var(--sw)); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: stroke .4s; }
  .wave .base { stroke: rgba(255,255,255,.15); stroke-width: 1; }
  .liquid { fill: var(--sw); transition: fill .5s; }
  .stem { fill: var(--sw); transition: fill .5s; }

  /* ---- The list ---- */
  .card {
    position: relative;
    container-type: inline-size;
    align-self: end;
    width: 100%;
    max-width: 560px;
    justify-self: center;
    padding: 4.6cqi 5.4cqi 4cqi;
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 2.4cqi 6cqi rgba(0,0,0,.45);
    outline: 1px solid var(--rule);
    outline-offset: -2.2cqi;
  }
  .now { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 0 4cqi; }
  .now-name { font-family: 'Italiana', serif; font-size: 10cqi; line-height: 1; }
  .now-name > font-kku { color: var(--ink); }
  .now-type { margin-top: 1cqi; font-size: 3.6cqi; color: var(--soft); font-style: italic; }
  .lang-ko .now-type { font-style: normal; }
  .now-score { font-family: 'Italiana', serif; font-size: 8cqi; color: var(--sw); text-align: right; line-height: 1; transition: color .4s; }
  .now-score small { display: block; font-family: 'Newsreader', 'Gowun Batang', serif; font-size: 2.8cqi; color: var(--soft); }
  .lang-ko .now-score { font-family: 'Newsreader', serif; font-weight: 600; font-size: 6.6cqi; }
  .label { margin-top: 3.2cqi; font-size: 2.9cqi; letter-spacing: .08em; color: var(--soft); }
  .notes { margin-top: .8cqi; font-size: 4.4cqi; line-height: 1.4; font-style: italic; min-height: 2.8em; }
  .lang-ko .notes { font-style: normal; font-size: 4.1cqi; line-height: 1.55; }
  .pairs { margin-top: .6cqi; font-size: 3.9cqi; }

  .list { margin-top: 3.4cqi; padding: 0; list-style: none; border-top: 1px solid var(--rule); }
  .list li { border-bottom: 1px solid #e3d8e2; }
  .list button {
    display: grid;
    grid-template-columns: 4cqi 1fr auto;
    align-items: center;
    gap: 2cqi;
    width: 100%;
    padding: 1.5cqi 0;
    border: 0;
    background: none;
    text-align: left;
    font-size: 3.7cqi;
    cursor: pointer;
  }
  .list .dot { width: 2.6cqi; height: 2.6cqi; border-radius: 50%; background: var(--c); }
  .list .nm { font-weight: 600; }
  .list .nm em { font-weight: 400; color: var(--soft); }
  .list .sc { color: var(--soft); font-variant-numeric: tabular-nums; }
  .list li.on button { background: linear-gradient(90deg, rgba(216, 180, 106, .22), transparent); }
  .list li.on .nm { color: var(--ink); }

  /* The sommelier's note. In one column it sits under the list; in the two-column layout it
     hangs from the card's bottom edge, over the empty padding only. Either way no score is
     covered. Its text is written from the start, so nothing jumps when it appears. */
  .sig {
    position: relative;
    width: auto;
    max-width: 84%;
    margin: 3cqi 0 0 auto;
    padding: 2.2cqi 3.4cqi;
    background: #fff9e8;
    color: #4a2c4e;
    font-family: 'Homemade Apple', cursive;
    font-size: 3.6cqi;
    line-height: 1.6;
    rotate: -2deg;
    box-shadow: 0 1.6cqi 3cqi rgba(0,0,0,.3);
    opacity: 0;
  }
  .sig > font-kku { color: #4a2c4e; }
  @container page (min-width: 760px) and (min-aspect-ratio: 1/1) {
    .sig { position: absolute; right: -2cqi; top: calc(100% - 3cqi); width: 54cqi; max-width: none; margin: 0; padding: 3.4cqi 4cqi; rotate: -4deg; }
  }

  @container (min-width: 760px) and (min-aspect-ratio: 1/1) {
    .page { grid-template-columns: 1fr 1.05fr; grid-template-rows: auto 1fr; column-gap: 5cqw; }
    .head { grid-column: 1 / -1; }
    .stage { align-self: center; align-items: center; height: 100%; max-height: 72cqh; grid-template-rows: minmax(0, 1fr) auto; }
    .card { align-self: center; }
  }
  /* Short phones: the list collapses to one line so the card fits. */
  @container (max-height: 640px) and (max-width: 520px) {
    .list button { padding: 1cqi 0; font-size: 3.4cqi; }
    .notes { min-height: 0; }
    .label { margin-top: 2.2cqi; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <h1>
      <span data-lang="en">Switch Sommelier</span>
      <span data-lang="ko"><font-kku font="geumbak" size="clamp(28px, 6.6cqmin, 60px)">키보드 축 소믈리에</font-kku></span>
    </h1>
    <p>
      <span data-lang="en">Tasting notes for the keys under your fingers.</span>
      <span data-lang="ko">손끝 아래 축들의 시음 노트.</span>
    </p>
  </header>

  <div class="stage" aria-hidden="true">
    <svg class="glass" viewBox="0 0 120 200">
      <defs>
        <clipPath id="bowl"><path d="M22 18 C 20 70, 34 96, 60 98 C 86 96, 100 70, 98 18 Z"/></clipPath>
        <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="rgba(255,255,255,.28)"/><stop offset=".4" stop-color="rgba(255,255,255,0)"/></linearGradient>
      </defs>
      <g class="tilt" style="transform-box: fill-box; transform-origin: 50% 100%;">
        <g clip-path="url(#bowl)">
          <path class="liquid" d="M-40 62 Q -20 54 0 62 T 40 62 T 80 62 T 120 62 T 160 62 V 120 H -40 Z"/>
        </g>
        <path d="M22 18 C 20 70, 34 96, 60 98 C 86 96, 100 70, 98 18" fill="url(#shine)" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
        <path d="M60 98 V 170 M36 176 Q 60 168 84 176" stroke="rgba(255,255,255,.55)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
    <svg class="key" viewBox="0 0 200 200">
      <rect x="54" y="132" width="92" height="44" rx="6" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
      <rect x="64" y="172" width="8" height="14" rx="2" fill="#c9a24e"/><rect x="128" y="172" width="8" height="14" rx="2" fill="#c9a24e"/>
      <g class="press">
        <path class="stem" d="M92 112 H108 V124 H118 V132 H108 V146 H92 V132 H82 V124 H92 Z"/>
        <path d="M30 70 L170 70 L162 116 Q160 122 154 122 L46 122 Q40 122 38 116 Z" fill="#cfc6b8"/>
        <rect x="44" y="34" width="112" height="56" rx="12" fill="#ece5d8"/>
        <path d="M52 40 H148" stroke="rgba(255,255,255,.7)" stroke-width="3" stroke-linecap="round"/>
        <g transform="translate(100 62)" stroke="#8a7b6a" stroke-width="2.4" fill="none" stroke-linecap="round">
          <path d="M-9 -12 C -10 -2, -6 4, 0 4 C 6 4, 10 -2, 9 -12 Z"/><path d="M0 4 V 13 M-6 14 H6"/>
        </g>
      </g>
    </svg>
    <svg class="wave" viewBox="0 0 300 40" preserveAspectRatio="none">
      <path class="base" d="M0 20 H300"/>
      <path class="line" d="M0 20"/>
    </svg>
  </div>

  <article class="card" aria-live="polite">
    <div class="now">
      <div>
        <h2 class="now-name"></h2>
        <p class="now-type"></p>
      </div>
      <p class="now-score"></p>
    </div>
    <p class="label notes-label"></p>
    <p class="notes"></p>
    <p class="label pairs-label"></p>
    <p class="pairs"></p>
    <ul class="list"></ul>
    <p class="sig"></p>
  </article>
</div>

<script>
(() => {
  const ko = TTY.lang === 'ko';
  const $ = (s) => document.querySelector(s);
  const root = document.documentElement;
  const nowName = $('.now-name');
  const nowType = $('.now-type');
  const nowScore = $('.now-score');
  const notes = $('.notes');
  const pairs = $('.pairs');
  const list = $('.list');
  const sig = $('.sig');
  const press = $('.press');
  const liquid = $('.liquid');
  const tilt = $('.tilt');
  const line = $('.wave .line');

  const SWITCHES = TTY.t({
    en: [
      { id: 'red', c: '#c0392b', name: 'Red', type: 'linear, 45 g, 4 mm travel', score: '92', notes: 'Light-bodied and linear, with notes of 3 a.m. deadlines. Smooth all the way down.', pairs: 'Gaming, and refactors after midnight.' },
      { id: 'brown', c: '#8a5a35', name: 'Brown', type: 'tactile, 55 g, 4 mm travel', score: '90', notes: 'Balanced, with a gentle tactile finish. Polite in any company.', pairs: 'Meetings and open-plan offices.' },
      { id: 'blue', c: '#2e6fd8', name: 'Blue', type: 'clicky, 60 g, 4 mm travel', score: '97', scoreNote: 'yours. 41 for your coworkers', notes: 'Bold and clicky. Your coworkers will remember this vintage.', pairs: 'Working alone. Far away.' },
      { id: 'silent', c: '#8c8f99', name: 'Silent', type: 'dampened linear, 45 g, 3.7 mm travel', score: '89', notes: 'So quiet the deadline never hears you coming. Hints of library.', pairs: 'Shared flats, sleeping babies, secret side projects.' },
      { id: 'black', c: '#2b2b30', name: 'Black', type: 'heavy linear, 60 g, 4 mm travel', score: '93', notes: 'Full-bodied and heavy. Builds character, and forearms.', pairs: 'Typing with conviction.' },
    ],
    ko: [
      { id: 'red', c: '#c0392b', name: '적축', type: '리니어, 작동압 45g, 이동 거리 4mm', score: '92점', notes: '가볍고 매끄러운 바디. 새벽 3시 마감의 향이 나요. 끝까지 부드럽게 넘어갑니다.', pairs: '게임, 그리고 자정 넘은 리팩터링' },
      { id: 'brown', c: '#8a5a35', name: '갈축', type: '택타일, 작동압 55g, 이동 거리 4mm', score: '90점', notes: '균형 잡힌 맛에 은은한 걸림이 남습니다. 어느 자리에서나 무난해요.', pairs: '회의, 그리고 개방형 사무실' },
      { id: 'blue', c: '#2e6fd8', name: '청축', type: '클리키, 작동압 60g, 이동 거리 4mm', score: '97점', scoreNote: '나에게. 옆자리는 41점', notes: '묵직하고 경쾌한 클릭감. 동료들이 이 빈티지를 오래 기억할 거예요.', pairs: '혼자 일하는 날. 아주 멀리서.' },
      { id: 'silent', c: '#8c8f99', name: '저소음', type: '저소음 리니어, 작동압 45g, 이동 거리 3.7mm', score: '89점', notes: '너무 조용해서 마감이 다가오는 소리도 안 들려요. 도서관 향이 은은합니다.', pairs: '룸메이트, 잠든 아기, 몰래 하는 사이드 프로젝트' },
      { id: 'black', c: '#2b2b30', name: '흑축', type: '묵직한 리니어, 작동압 60g, 이동 거리 4mm', score: '93점', notes: '풀바디에 묵직한 압. 인내심과 팔뚝을 함께 길러 줍니다.', pairs: '확신에 찬 타이핑' },
    ],
  });
  const L = TTY.t({
    en: { notes: 'Tasting notes', pairs: 'Pairs with', score: 'points', sig: "Sommelier's pick: whichever one makes you want to write." },
    ko: { notes: '시음 노트', pairs: '추천 페어링', score: '', sig: '소믈리에 추천: 당신을 쓰고 싶게 만드는 축.' },
  });
  $('.notes-label').textContent = L.notes;
  $('.pairs-label').textContent = L.pairs;

  // Black ink on a black switch would vanish in the glass: the liquid gets a little light.
  const LIQUID = { red: '#a3242c', brown: '#7a4a2a', blue: '#2e6fd8', silent: '#9aa0ad', black: '#3c3542' };
  const WAVE = { red: '#e0544a', brown: '#c98a5a', blue: '#5a95f0', silent: '#b9bdc8', black: '#bdb3cc' };

  const items = SWITCHES.map((sw, i) => {
    const li = document.createElement('li');
    li.innerHTML = '<button type="button"><span class="dot"></span><span class="nm"></span><span class="sc"></span></button>';
    li.style.setProperty('--c', sw.c);
    li.querySelector('.nm').textContent = sw.name;
    li.querySelector('.sc').textContent = sw.score;
    li.querySelector('button').addEventListener('click', (e) => { if (!e.isTrusted) return; takeOver(); taste(i); });
    list.append(li);
    return li;
  });

  /* ---- The sound of a switch, drawn ---- */
  const PROFILE = {
    red: (t) => Math.sin(Math.PI * t) * .32,
    brown: (t) => Math.sin(Math.PI * t) * .38 + (t > .22 && t < .34 ? .22 : 0),
    blue: (t) => (t < .14 ? t / .14 * .2 : t < .24 ? .95 : .95 * Math.exp(-(t - .24) * 9)) + .05,
    silent: (t) => Math.sin(Math.PI * t) * .07,
    black: (t) => Math.pow(Math.sin(Math.PI * t), .6) * .5,
  };
  function pulse(id, from, width) {
    const pts = [];
    const n = 60;
    for (let k = 0; k <= n; k++) {
      const t = k / n;
      const env = PROFILE[id](t);
      const osc = Math.sin(k * (id === 'blue' ? 2.6 : id === 'black' ? .9 : 1.6));
      pts.push(`${(from + t * width).toFixed(1)} ${(20 - env * osc * 18).toFixed(1)}`);
    }
    return pts.join(' L');
  }
  let waveD = 'M0 20';
  function drawPulse(id, k) {
    const w = 300 / 3;
    waveD += ` L${(k * w).toFixed(1)} 20 L${pulse(id, k * w + 8, w - 16)} L${((k + 1) * w).toFixed(1)} 20`;
    line.setAttribute('d', waveD);
    if (!TTY.reduce) {
      const len = line.getTotalLength();
      line.style.strokeDasharray = `${len}`;
      line.animate([{ strokeDashoffset: (300 / 3) * 1.6 }, { strokeDashoffset: 0 }], { duration: 420, easing: 'ease-out' });
    }
  }

  /* ---- Tasting ---- */
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  let current = -1;
  let shownName = '';
  function show(i) {
    const sw = SWITCHES[i];
    current = i;
    root.style.setProperty('--sw', sw.c);
    root.style.setProperty('--wave', WAVE[sw.id]);
    liquid.style.fill = LIQUID[sw.id];
    items.forEach((li, k) => li.classList.toggle('on', k === i));
    if (ko) {
      if (shownName !== sw.name) {
        const el = document.createElement('font-kku');
        el.setAttribute('font', 'sebul');
        el.setAttribute('size', '9.4cqi');
        el.textContent = sw.name;
        nowName.replaceChildren(el);
      }
    } else {
      nowName.textContent = sw.name;
    }
    shownName = sw.name;
    nowType.textContent = sw.type;
    nowScore.innerHTML = '';
    nowScore.append(sw.score);
    const small = document.createElement('small');
    small.textContent = sw.scoreNote || L.score;
    if (small.textContent) nowScore.append(small);
    notes.textContent = sw.notes;
    pairs.textContent = sw.pairs;
    if (!TTY.reduce) [nowName, notes, pairs].forEach((el, k) => el.animate([{ opacity: 0, filter: 'blur(3px)' }, { opacity: 1, filter: 'blur(0)' }], { duration: 420, delay: k * 90, easing: 'ease-out', fill: 'backwards' }));
  }
  function swirl() {
    if (TTY.reduce) return;
    liquid.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-40px)' }], { duration: 900, iterations: 2, easing: 'ease-in-out' });
    tilt.animate([{ rotate: '0deg' }, { rotate: '-7deg' }, { rotate: '6deg' }, { rotate: '-3deg' }, { rotate: '0deg' }], { duration: 1500, easing: 'ease-in-out' });
  }
  async function strike(id, k) {
    const travel = id === 'silent' ? 13 : 15;
    const down = id === 'black' ? 170 : id === 'blue' ? 90 : 120;
    if (!TTY.reduce) {
      const frames = id === 'brown' || id === 'blue'
        ? [{ transform: 'none' }, { transform: `translateY(${travel * .35}px)`, offset: .3 }, { transform: `translateY(${travel * .4}px)`, offset: .42 }, { transform: `translateY(${travel}px)`, offset: .6 }, { transform: 'none' }]
        : [{ transform: 'none' }, { transform: `translateY(${travel}px)`, offset: .5 }, { transform: 'none' }];
      press.animate(frames, { duration: down * 2.6, easing: 'ease-in-out' });
    }
    drawPulse(id, k);
    await wait(TTY.reduce ? 0 : down * 2.6 + 180);
  }
  async function taste(i, live = () => true) {
    show(i);
    waveD = 'M0 20';
    line.setAttribute('d', waveD);
    swirl();
    await wait(TTY.reduce ? 0 : 900); if (!live()) return;
    for (let k = 0; k < 3; k++) { await strike(SWITCHES[i].id, k); if (!live()) return; }
  }

  function writeNote() {
    if (ko) {
      const el = document.createElement('font-kku');
      el.setAttribute('font', 'pilgi');
      el.setAttribute('size', '4.4cqi');
      el.setAttribute('wrap-unit', 'word');
      el.textContent = L.sig;
      sig.replaceChildren(el);
    } else {
      sig.textContent = L.sig;
    }
  }
  function signNote() {
    sig.style.opacity = 1;
    if (!TTY.reduce) sig.animate([{ opacity: 0, transform: 'translateY(20%) rotate(6deg)' }, { opacity: 1, transform: 'none' }], { duration: 520, easing: 'cubic-bezier(.2,.9,.3,1.1)' });
  }

  /* ---- Autoplay and taking over ---- */
  let run = 0;
  async function play() {
    const mine = ++run;
    const live = () => run === mine;
    while (live()) {
      sig.style.opacity = 0;
      for (let i = 0; i < SWITCHES.length; i++) {
        await taste(i, live); if (!live()) return;
        await wait(1500); if (!live()) return;
      }
      signNote();
      await wait(5200);
    }
  }
  function takeOver() { run++; }
  $('.key').addEventListener('click', (e) => {
    if (!e.isTrusted) return;
    takeOver();
    const sw = SWITCHES[Math.max(current, 0)];
    if (current < 0) show(0);
    waveD = 'M0 20';
    strike(sw.id, 0);
  });

  /* ---- Start ---- */
  writeNote();
  if (TTY.reduce) {
    show(2);
    for (let k = 0; k < 3; k++) drawPulse('blue', k);
    signNote();
  } else {
    show(0);
  }
  TTY.onShow(() => { if (!TTY.reduce) play(); });
  const loaded = new Promise((r) => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
  Promise.all([loaded, document.fonts.ready]).then(TTY.ready);
})();
</script>
</body>
</html>
